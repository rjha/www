<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XStudio - Hindi TILE MATCH</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
    <!-- Apple Touch Icon for iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <!-- Web Manifest -->
    <link rel="manifest" href="/assets/favicon/site.webmanifest">

    <!-- Tailwind CDN / Local Assets -->
    <script src="/assets/tailwind.js"></script>
    
    <style>
        .game-btn { 
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-btn:active:not(.matched) { 
            transform: translateY(2px);
        }
        .matched {
            pointer-events: none;
        }
        /* Neon Glow Effects */
        .glow-cyan {
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.35);
        }
        .glow-yellow {
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.35);
        }
        .glow-white {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        .glow-red {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center font-sans p-4 select-none">

    <!-- ARCADE DASHBOARD CONTAINER -->
    <div id="matching-game-card" class="bg-slate-900 rounded-2xl shadow-2xl p-6 max-w-xl w-full text-center border-2 border-slate-700 glow-cyan relative">
        
        <!-- Top Bar Status Row -->
        <div class="flex justify-between items-center mb-6 bg-slate-950 p-3 rounded-xl border border-slate-800">
            <span class="text-base font-extrabold text-yellow-400 bg-slate-900 border border-yellow-500/30 px-3 py-1 rounded-lg flex items-center gap-1.5">
                ⚡ SCORE: <span id="match-score-display" class="text-white">0</span>
            </span>

            <!-- Monster Game Level Selector Button -->
            <button onclick="showLevelSelectOverlay()" class="text-xs font-bold text-emerald-400 bg-slate-900 border border-emerald-500/30 px-3 py-1.5 rounded-lg hover:bg-emerald-950/40 transition cursor-pointer flex items-center gap-1.5">
                LEVEL: <span id="current-level-display" class="text-white font-extrabold">1</span> ⚙️
            </button>

            <span class="text-sm font-bold text-cyan-400 bg-slate-900 border border-cyan-500/30 px-3 py-1 rounded-lg">
                PAIRS: <span id="match-pairs-count" class="text-white">0</span> / 6
            </span>
        </div>

        <!-- Header Banner -->
        <div class="mb-6">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-yellow-400 uppercase tracking-wide">
                WORD TILE MATCH
            </h1>
            <p class="text-slate-400 text-xs mt-1 font-semibold tracking-wide">
                CLICK THE <span class="text-cyan-400">HINDI TILE</span> THEN MATCHING <span class="text-yellow-400">ENGLISH TILE</span>
            </p>
        </div>

        <!-- 12-Card Grid Layout -->
        <div id="matching-grid-board" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 min-h-[300px] mb-4">
            <!-- Dynamically injected JS cards go here -->
        </div>

        <!-- Victory Screen Overlay -->
        <div id="match-victory-screen" class="hidden mt-6 p-5 bg-slate-950 rounded-xl border-2 border-yellow-400 text-center glow-yellow">
            <h2 class="text-2xl font-black text-yellow-400 mb-1 uppercase tracking-wider">🎉 BOARD CLEARED!</h2>
            <p class="text-slate-300 text-xs font-semibold mb-4">ALL TILES MATCHED</p>
            <button onclick="fetchNextBatchAndStartRound()" class="bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black py-2.5 px-6 rounded-lg border-b-4 border-yellow-600 active:border-b-0 uppercase tracking-wider transition cursor-pointer">
                NEXT BATCH
            </button>
        </div>
    </div>

    <!-- MONSTER GAME LEVEL SELECTION OVERLAY -->
    <div id="level-select-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border-2 border-cyan-500 rounded-2xl p-6 max-w-sm w-full text-center glow-cyan shadow-2xl">
            <h2 class="text-2xl font-black text-cyan-400 mb-1 uppercase tracking-wide">SELECT LEVEL</h2>
            <p class="text-slate-400 text-xs font-semibold mb-6">Choose your difficulty level</p>
            
            <div id="level-buttons-grid" class="grid grid-cols-3 gap-3 mb-6">
                <!-- Dynamically rendered level buttons matching Monster Game aesthetic -->
            </div>

            <button onclick="hideLevelSelectOverlay()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-lg border border-slate-600 transition uppercase tracking-wider text-xs cursor-pointer">
                CANCEL
            </button>
        </div>
    </div>

    <!-- GAME OVER / LEVEL CLEARED OVERLAY -->
    <div id="game-over-overlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border-2 border-red-500 rounded-2xl p-6 max-w-sm w-full text-center glow-red shadow-2xl">
            <div class="text-5xl mb-2">🏆</div>
            <h2 class="text-2xl font-black text-red-500 mb-1 uppercase tracking-wider">LEVEL CLEARED!</h2>
            <p class="text-slate-300 text-xs font-semibold mb-4">No more words available for Level <span id="game-over-level-num">1</span>.</p>
            
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 mb-6">
                <span class="text-slate-400 text-xs font-bold uppercase block mb-1">Final Score</span>
                <span id="game-over-final-score" class="text-2xl font-black text-yellow-400">0</span>
            </div>

            <div class="flex flex-col gap-2">
                <button onclick="restartCurrentLevel()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black py-2.5 rounded-lg border-b-4 border-yellow-600 active:border-b-0 uppercase tracking-wider transition cursor-pointer">
                    RESTART LEVEL
                </button>
                <button onclick="showLevelSelectOverlayFromGameOver()" class="w-full bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-2.5 rounded-lg border border-slate-600 uppercase tracking-wider transition cursor-pointer">
                    SELECT LEVEL
                </button>
            </div>
        </div>
    </div>

    <script>
        // Parse query params initialized by index.html
        const urlParams = new URLSearchParams(window.location.search);
        let sessionUuid = urlParams.get('session_uuid');
        const PAGE_DEBUG = urlParams.get('page_debug') === '1';

        // Macro-like logging wrapper
        const debugLog = PAGE_DEBUG ? console.log.bind(console, '[DEBUG]') : () => {};

        const GAME_NAME = "TILE_MATCH";
        const BATCH_SIZE = 6;
        const TOTAL_LEVELS = 5;

        // Guard clause: redirect if session_uuid isn't present
        if (!sessionUuid) {
            window.location.href = "/hindi/index.html";
        }

        let wordDictionary = {}; // Map: root (Hindi) -> Array of English meanings
        let activeBatchTokens = []; // Current batch of 6 words fetched from API
        let selectedCards = []; 
        let matchScore = 0;
        let pairsFound = 0;
        let audioCtx = null;
        let gameActiveLevel = 1;
        let gameCompletedLevels = [];

        // --- Step 1: Pre-load local db/words.json for dictionary lookup ---
        async function initGame() {
            try {
                const response = await fetch('db/words.json');
                const rawJson = await response.json();
                
                // Map Hindi roots to their English translations for fast lookup
                rawJson.forEach(item => {
                    wordDictionary[item.root] = item.root_english;
                });
                
                debugLog("Dictionary loaded. Total entries:", Object.keys(wordDictionary).length);

                // Restore saved state score or start fresh
                await loadSavedGameState();
                // Fetch first batch of 6 words from backend
                await fetchNextBatchAndStartRound();
            } catch (error) {
                console.error("Failed to initialize game dictionary:", error);
            }
        }

        // --- Step 2: API Integration & Monster Game State ---
        async function loadSavedGameState() {
            try {
                const response = await fetch('/boa/v1/game/state/get', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_uuid: sessionUuid, game_name: GAME_NAME })
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.game_data) {
                        gameActiveLevel = parseInt(data.game_data.currentLevel, 10) || 1;
                        matchScore = data.game_data.matchScore || 0;
                        gameCompletedLevels = Array.isArray(data.game_data.finishedLevels) ? data.game_data.finishedLevels : [];
                        
                        updateHeaderUI();
                        debugLog("loaded game state, score:", matchScore, "level:", gameActiveLevel, "completedLevels:", gameCompletedLevels);
                    }
                } else {
                    gameActiveLevel = 1;
                    matchScore = 0;
                    gameCompletedLevels = [];
                    updateHeaderUI();
                    debugLog("set initial state, score:", matchScore, "level:", gameActiveLevel);
                }
            } catch (e) {
                debugLog("No existing state found or failed to load state:", e);
            }
        }

        async function saveGameState(currentLevel, currentScore, finishedLevels = gameCompletedLevels) {
            try {
                await fetch('/boa/v1/game/state/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_uuid: sessionUuid,
                        game_name: GAME_NAME,
                        game_data: {
                            currentLevel: currentLevel,
                            matchScore: currentScore,
                            finishedLevels: finishedLevels
                        }
                    })
                });

                debugLog("Saved state successfully, score:", currentScore, "level:", currentLevel, "finishedLevels:", finishedLevels);
            } catch (e) {
                console.error("Error saving game state:", e);
            }
        }

        async function fetchNextBatchAndStartRound() {
            try {
                document.getElementById('match-victory-screen').classList.add('hidden');
                document.getElementById('game-over-overlay').classList.add('hidden');
                
                const response = await fetch('/boa/v1/game/words/next', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_uuid: sessionUuid,
                        game_name: GAME_NAME,
                        batch_size: BATCH_SIZE,
                        game_level: gameActiveLevel
                    })
                });

                if (!response.ok) throw new Error("API word fetch failed");

                const data = await response.json();
                activeBatchTokens = data.tokens || [];  
                debugLog("Fetched new word batch from API:", activeBatchTokens);

                // Game Over handling when level batch runs out
                if (activeBatchTokens.length === 0) {
                    if (!gameCompletedLevels.includes(gameActiveLevel)) {
                        gameCompletedLevels.push(gameActiveLevel);
                        await saveGameState(gameActiveLevel, matchScore, gameCompletedLevels);
                    }
                    showGameOverOverlay();
                    return;
                }

                startMatchingGameRound();

            } catch (error) {
                console.error("Error fetching word batch from server:", error);
            }
        }

        // --- Monster Game Level Select Overlay UI & Rendering ---
        function renderLevelSelectGrid() {
            const grid = document.getElementById('level-buttons-grid');
            grid.innerHTML = "";

            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                const isCurrent = i === gameActiveLevel;
                const isCompleted = gameCompletedLevels.includes(i);

                const btn = document.createElement('button');
                btn.onclick = () => selectGameLevel(i);

                let baseClasses = "relative font-black py-3 rounded-xl transition flex flex-col items-center justify-center border-2 cursor-pointer ";
                
                if (isCurrent) {
                    baseClasses += "bg-cyan-950 text-cyan-300 border-cyan-400 glow-cyan";
                } else if (isCompleted) {
                    baseClasses += "bg-emerald-950/60 text-emerald-400 border-emerald-500 hover:bg-emerald-900/80";
                } else {
                    baseClasses += "bg-slate-950 text-slate-300 border-slate-700 hover:border-cyan-500 hover:text-cyan-400";
                }

                btn.className = baseClasses;
                btn.innerHTML = `
                    <span>LVL ${i}</span>
                    ${isCompleted ? '<span class="text-[10px] text-emerald-400 font-extrabold mt-0.5">✓ CLEAR</span>' : ''}
                `;

                grid.appendChild(btn);
            }
        }

        function showLevelSelectOverlay() {
            renderLevelSelectGrid();
            document.getElementById('level-select-modal').classList.remove('hidden');
        }

        function hideLevelSelectOverlay() {
            document.getElementById('level-select-modal').classList.add('hidden');
        }

        async function selectGameLevel(levelNum) {
            gameActiveLevel = levelNum;
            updateHeaderUI();
            hideLevelSelectOverlay();
            await saveGameState(gameActiveLevel, matchScore);
            await fetchNextBatchAndStartRound();
        }

        // --- Game Over Overlay Controls ---
        function showGameOverOverlay() {
            document.getElementById('game-over-level-num').innerText = gameActiveLevel;
            document.getElementById('game-over-final-score').innerText = matchScore;
            document.getElementById('game-over-overlay').classList.remove('hidden');
            playDisappointingSound();
        }

        function restartCurrentLevel() {
            document.getElementById('game-over-overlay').classList.add('hidden');
            fetchNextBatchAndStartRound();
        }

        function showLevelSelectOverlayFromGameOver() {
            document.getElementById('game-over-overlay').classList.add('hidden');
            showLevelSelectOverlay();
        }

        function updateHeaderUI() {
            document.getElementById('match-score-display').innerText = matchScore;
            document.getElementById('current-level-display').innerText = gameActiveLevel;
        }

        // --- Audio FX ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTileClickSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(850, now + 0.05);
            gainNode.gain.setValueAtTime(0.12, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
        }

        function playClapSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + (index * 0.08));
                gainNode.gain.setValueAtTime(0.2, now + (index * 0.08));
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + (index * 0.08) + 0.15);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start(now + (index * 0.08));
                osc.stop(now + (index * 0.08) + 0.15);
            });
        }

        function playDisappointingSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now); 
            osc.frequency.linearRampToValueAtTime(90, now + 0.5); 
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
        }

        function getCardBaseClass(type) {
            if (type === 'hindi') {
                return "game-btn bg-slate-900 hover:bg-slate-800 text-cyan-300 font-bold border-2 border-cyan-400 border-b-4 rounded-xl p-3 text-base shadow-md cursor-pointer flex items-center justify-center min-h-[70px]";
            } else {
                return "game-btn bg-slate-900 hover:bg-slate-800 text-yellow-300 font-bold border-2 border-yellow-400 border-b-4 rounded-xl p-3 text-base shadow-md cursor-pointer flex items-center justify-center min-h-[70px]";
            }
        }

        // --- Step 3: Game Board Setup ---
        function startMatchingGameRound() {
            pairsFound = 0;
            selectedCards = [];

            updateHeaderUI();
            document.getElementById('match-pairs-count').innerText = pairsFound;

            const cardsArray = [];
            activeBatchTokens.forEach((hindiWord, index) => {
                const englishMeanings = wordDictionary[hindiWord] || ["Translation"];
                const randomEnglish = englishMeanings[Math.floor(Math.random() * englishMeanings.length)];
                
                cardsArray.push({ id: index, token: hindiWord, type: 'hindi', text: hindiWord });
                cardsArray.push({ id: index, token: hindiWord, type: 'english', text: randomEnglish });
            });

            const shuffledCards = cardsArray.sort(() => 0.5 - Math.random());
            renderMatchingGrid(shuffledCards);
        }

        function renderMatchingGrid(cards) {
            const board = document.getElementById('matching-grid-board');
            board.innerHTML = "";

            cards.forEach(card => {
                const btn = document.createElement('button');
                btn.className = getCardBaseClass(card.type);
                btn.innerText = card.text;

                btn.onclick = () => handleCardClick(card, btn);
                board.appendChild(btn);
            });
        }

        // --- Step 4: Click & Match Logic ---
        function handleCardClick(cardData, buttonElement) {
            if (selectedCards.length >= 2 || buttonElement.classList.contains('matched') || (selectedCards.length === 1 && buttonElement === selectedCards[0].element)) return;

            playTileClickSound();

            buttonElement.className = "game-btn bg-slate-800 text-white font-extrabold border-2 border-white border-b-4 rounded-xl p-3 text-base shadow-md cursor-pointer flex items-center justify-center min-h-[70px] glow-white";
            selectedCards.push({ data: cardData, element: buttonElement });

            if (selectedCards.length === 2) {
                const [card1, card2] = selectedCards;

                if (card1.data.id === card2.data.id && card1.data.type !== card2.data.type) {
                    // Match Correct
                    matchScore += 5;
                    pairsFound++;
                    playClapSound();

                    const hindiCard = card1.data.type === 'hindi' ? card1 : card2;
                    const englishCard = card1.data.type === 'english' ? card1 : card2;

                    englishCard.element.remove();

                    hindiCard.element.innerText = `${hindiCard.data.text} = ${englishCard.data.text}`;
                    hindiCard.element.className = "game-btn bg-slate-900 text-emerald-400 border-2 border-emerald-500 rounded-xl p-3 font-black text-lg text-center shadow matched col-span-2 flex items-center justify-center min-h-[70px]";

                    updateHeaderUI();
                    document.getElementById('match-pairs-count').innerText = pairsFound;

                    if (pairsFound === activeBatchTokens.length) {
                        saveGameState(gameActiveLevel, matchScore);
                        document.getElementById('match-victory-screen').classList.remove('hidden');
                    }

                    selectedCards = [];

                } else {
                    // Match Incorrect
                    matchScore -= 2;
                    playDisappointingSound();

                    selectedCards.forEach(card => {
                        card.element.className = "game-btn bg-rose-950 text-rose-400 border-2 border-rose-600 rounded-xl p-3 font-bold text-center shadow flex items-center justify-center min-h-[70px]";
                    });

                    setTimeout(() => {
                        selectedCards.forEach(card => {
                            card.element.className = getCardBaseClass(card.data.type);
                        });
                        selectedCards = [];
                    }, 800);
                }

                updateHeaderUI();
            }
        }

        // Initialize application
        initGame();
    </script>
</body>
</html>
