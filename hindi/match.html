<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XStudio - Hindi TILE MATCH</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
    <!-- Apple Touch Icon for iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <!-- Web Manifest -->
    <link rel="manifest" href="/assets/favicon/site.webmanifest">

    <!-- Tailwind CDN / Local Assets -->
    <script src="/assets/tailwind.js"></script>
    
    <style>
        .game-btn { 
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-btn:active:not(.matched) { 
            transform: translateY(2px);
        }
        .matched {
            pointer-events: none;
        }
        /* Neon Glow Effects */
        .glow-cyan {
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.35);
        }
        .glow-yellow {
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.35);
        }
        .glow-white {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        .glow-red {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center font-sans p-4 select-none">

    <!-- ARCADE DASHBOARD CONTAINER -->
    <div id="matching-game-card" class="bg-slate-900 rounded-2xl shadow-2xl p-6 max-w-xl w-full text-center border-2 border-slate-700 glow-cyan relative">
        
        <!-- Top Bar Status Row -->
        <div class="flex justify-between items-center mb-6 bg-slate-950 p-3 rounded-xl border border-slate-800">
            <a href="index.html" class="text-yellow-400 hover:text-yellow-300 font-bold text-sm uppercase transition">HOME</a>
            <span class="text-base font-extrabold text-yellow-400 bg-slate-900 border border-yellow-500/30 px-3 py-1 rounded-lg flex items-center gap-1.5">
                ⚡ SCORE: <span id="match-score-display" class="text-white">0</span>
            </span>

            <!-- Level Selector Trigger Button -->
            <button onclick="showLevelSelectGui()" class="text-xs font-bold text-emerald-400 bg-slate-900 border border-emerald-500/30 px-3 py-1.5 rounded-lg hover:bg-emerald-950/40 transition cursor-pointer flex items-center gap-1.5">
                LEVEL: <span id="current-level-display" class="text-white font-extrabold">1</span> ⚙️
            </button>

            <span class="text-sm font-bold text-cyan-400 bg-slate-900 border border-cyan-500/30 px-3 py-1 rounded-lg">
                <span id="match-pairs-count" class="text-white">0</span> / 6
            </span>
        </div>

        <!-- Header Banner -->
        <div class="mb-6">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-yellow-400 uppercase tracking-wide">
                WORD TILE MATCH
            </h1>
            <p class="text-slate-400 text-xs mt-1 font-semibold tracking-wide">
                CLICK THE <span class="text-cyan-400">HINDI TILE</span> THEN MATCHING <span class="text-yellow-400">ENGLISH TILE</span>
            </p>
        </div>

        <!-- 12-Card Grid Layout -->
        <div id="matching-grid-board" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 min-h-[300px] mb-4">
            <!-- Dynamically injected JS cards go here -->
        </div>

        <!-- Victory Screen Overlay -->
        <div id="match-victory-screen" class="hidden mt-6 p-5 bg-slate-950 rounded-xl border-2 border-yellow-400 text-center glow-yellow">
            <h2 class="text-2xl font-black text-yellow-400 mb-1 uppercase tracking-wider">🎉 BOARD CLEARED!</h2>
            <p class="text-slate-300 text-xs font-semibold mb-4">ALL TILES MATCHED</p>
            <button onclick="fetchNextBatchAndPlay()" class="bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black py-2.5 px-6 rounded-lg border-b-4 border-yellow-600 active:border-b-0 uppercase tracking-wider transition cursor-pointer">
                NEXT BATCH
            </button>
        </div>
    </div>

    <!-- Level Selector Overlay Box -->
    <div id="level-select-box" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center text-center p-4 z-50 hidden">
        <div class="bg-slate-900 border-4 border-cyan-500 rounded-3xl p-8 max-w-md w-full shadow-2xl">
            <h1 class="text-3xl font-black text-cyan-400 mb-1 tracking-wider">SELECT LEVEL</h1>
            <p class="text-sm text-slate-400 mb-6 font-semibold">Choose word difficulty level to launch</p>
            
            <div id="level-buttons" class="grid grid-cols-1 gap-3 mb-4">
                <button data-source="level1" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                    <span class="font-extrabold text-cyan-300 flex items-center gap-2">Level 1 <span class="completed-badge"></span></span>
                    <span class="text-xs text-slate-400 group-hover:text-slate-200">Easy Peasy Words</span>
                </button>
                <button data-source="level2" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                    <span class="font-extrabold text-cyan-300 flex items-center gap-2">Level 2 <span class="completed-badge"></span></span>
                    <span class="text-xs text-slate-400 group-hover:text-slate-200">A little grunt</span>
                </button>
                <button data-source="level3" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                    <span class="font-extrabold text-cyan-300 flex items-center gap-2">Level 3 <span class="completed-badge"></span></span>
                    <span class="text-xs text-slate-400 group-hover:text-slate-200">Some Heavy Lifting</span>
                </button>
                <button data-source="level4" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                    <span class="font-extrabold text-cyan-300 flex items-center gap-2">Level 4 <span class="completed-badge"></span></span>
                    <span class="text-xs text-slate-400 group-hover:text-slate-200">Master class</span>
                </button>
            </div>

            <button onclick="hideLevelSelectGui()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl border border-slate-600 transition uppercase tracking-wider text-xs cursor-pointer">
                CANCEL
            </button>
        </div>
    </div>

    <!-- GAME OVER / LEVEL CLEARED OVERLAY -->
    <div id="game-over-overlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border-2 border-red-500 rounded-2xl p-6 max-w-sm w-full text-center glow-red shadow-2xl">
            <div class="text-5xl mb-2">🏆</div>
            <h2 class="text-2xl font-black text-red-500 mb-1 uppercase tracking-wider">LEVEL <span id="game-over-level-num">1</span> CLEARED!</h2>
            <p class="text-slate-300 text-xs font-semibold mb-4">SELECT A DIFFERENT LEVEL </p>
            
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 mb-6">
                <span class="text-slate-400 text-xs font-bold uppercase block mb-1">Final Score</span>
                <span id="game-over-final-score" class="text-2xl font-black text-yellow-400">0</span>
            </div>

            <div class="flex flex-col gap-2">
                <button onclick="restartCurrentLevel()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black py-2.5 rounded-lg border-b-4 border-yellow-600 active:border-b-0 uppercase tracking-wider transition cursor-pointer">
                    RESTART LEVEL
                </button>
                
                <button onclick="selectLevelFromGameOver()" class="w-full bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-2.5 rounded-lg border border-slate-600 uppercase tracking-wider transition cursor-pointer">
                    SELECT LEVEL
                </button>
            </div>
        </div>
    </div>

    <script>
        // Parse query params initialized by index.html
        const urlParams = new URLSearchParams(window.location.search);
        let sessionUuid = urlParams.get('session_uuid');
        const PAGE_DEBUG = urlParams.get('page_debug') === '1';

        // Macro-like logging wrapper
        const debugLog = PAGE_DEBUG ? console.log.bind(console, '[DEBUG]') : () => {};

        const GAME_NAME = "TILE_MATCH";
        const BATCH_SIZE = 6;

        // Guard clause: redirect if session_uuid isn't present
        if (!sessionUuid) {
            window.location.href = "/hindi/index.html";
        }

        let wordDictionary = {}; // Map: root (Hindi) -> Array of English meanings
        let activeBatchTokens = []; // Current batch of 6 words fetched from API
        let selectedCards = []; 
        let matchScore = 0;
        let pairsFound = 0;
        let audioCtx = null;
        let gameActiveLevel = 1;
        let gameCompletedLevels = [];

        // --- Step 1: Pre-load local db/words.json for dictionary lookup ---
        async function initGame() {
            try {
                // Attach HTML level button click handlers
                setupLevelButtonListeners();

                const response = await fetch('db/words.json');
                const rawJson = await response.json();
                
                // Map Hindi roots to their English translations for fast lookup
                rawJson.forEach(item => {
                    wordDictionary[item.root] = item.root_english;
                });
                
                debugLog("Dictionary loaded. Total entries:", Object.keys(wordDictionary).length);

                // Restore saved state score or start fresh
                await loadGameState();
                // Fetch first batch of 6 words from backend
                await fetchNextBatchAndPlay();
            } catch (error) {
                console.error("Failed to initialize game dictionary:", error);
            }
        }

        // --- Level Selector HTML Button Wiring ---
        function setupLevelButtonListeners() {
            const buttons = document.querySelectorAll('#level-buttons button[data-source]');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const dataSource = btn.getAttribute('data-source');
                    // Extracts integer from data-source string, e.g. "level1" -> 1
                    const levelNum = parseInt(dataSource.replace('level', ''), 10);
                    if (!isNaN(levelNum)) {
                        selectLevel(levelNum);
                    }
                });
            });
        }

        function updateLevelSelectGui() {
            const buttons = document.querySelectorAll('#level-buttons button[data-source]');
            buttons.forEach(btn => {
                const dataSource = btn.getAttribute('data-source');
                const levelNum = parseInt(dataSource.replace('level', ''), 10);
                const badgeSpan = btn.querySelector('.completed-badge');
                
                // Active level highlighting
                if (levelNum === gameActiveLevel) {
                    btn.classList.add('border-cyan-400', 'bg-slate-800');
                } else {
                    btn.classList.remove('border-cyan-400', 'bg-slate-800');
                }

                // Completed level badge
                if (badgeSpan) {
                    if (gameCompletedLevels.includes(levelNum)) {
                        badgeSpan.innerHTML = `<span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-500/50 px-1.5 py-0.5 rounded font-black">✓ DONE</span>`;
                    } else {
                        badgeSpan.innerHTML = ``;
                    }
                }
            });
        }

        function showLevelSelectGui() {
            updateLevelSelectGui();
            document.getElementById('level-select-box').classList.remove('hidden');
        }

        function hideLevelSelectGui() {
            document.getElementById('level-select-box').classList.add('hidden');
        }

        async function selectLevel(levelNum) {
            gameActiveLevel = levelNum;
            updateHeaderUI();
            hideLevelSelectGui();
            await saveGameState(gameActiveLevel, matchScore);
            await fetchNextBatchAndPlay();
        }

        // #################################################
        //  API Integration & Game State
        // 
        // #################################################

       async function loadGameState() {
            try {
                const response = await fetch('/boa/v1/game/state/get', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_uuid: sessionUuid, game_name: GAME_NAME })
                });

                const res = await response.json();

                // 1. Success (200 OK)
                if (response.ok && res.status === 'success') {
                    const state = res.data; 
                    if (state && state.game_data) {
                        gameActiveLevel = parseInt(state.game_data.currentLevel, 10) || 1;
                        matchScore = state.game_data.matchScore || 0;
                        gameCompletedLevels = Array.isArray(state.game_data.finishedLevels) 
                            ? state.game_data.finishedLevels 
                            : [];
                        
                        updateHeaderUI();
                        debugLog("Loaded game state:", { matchScore, gameActiveLevel });
                        return;
                    }
                }

                // 2. Expected Client/Business Error (400 Bad Request - e.g., State Not Found)
                if (response.status === 400) {
                    debugLog("No state found for session/game, showing GUI:", res.message);
                    showLevelSelectGui();
                    return;
                }

                // 3. Unexpected Server Failure (500 or other 5xx errors)
                console.error("Server failure loading state:", res.message);
                alert("Server error loading saved progress. Please try refreshing or re-logging.");

            } catch (e) {
                // Network failures / fetch rejections
                debugLog("Network or parsing error loading state:", e);
            }
        }

        async function saveGameState(currentLevel, currentScore, finishedLevels = gameCompletedLevels) {
            try {

                const response = await fetch('/boa/v1/game/state/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_uuid: sessionUuid,
                        game_name: GAME_NAME,
                        game_data: {
                            currentLevel: currentLevel,
                            matchScore: currentScore,
                            finishedLevels: finishedLevels
                        }
                    })
                });

                const res = await response.json();
                if (res.status !== 'success') {
                    console.error('API Error:', res.message);
                    alert(`Error: ${res.message}`);
                    return;
                }

                debugLog(
                    "Game State to DB -> currentLevel:", currentLevel, 
                    "score:", currentScore,
                    "finishedLevels:", JSON.stringify(finishedLevels)
                );

            } catch (e) {
                console.error("Error saving game state:", e);
            }
        }

        async function fetchNextBatchAndPlay() {

            try {

                document.getElementById('match-victory-screen').classList.add('hidden');
                document.getElementById('game-over-overlay').classList.add('hidden');
                
                const response = await fetch('/boa/v1/game/words/next', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_uuid: sessionUuid,
                        game_name: GAME_NAME,
                        batch_size: BATCH_SIZE,
                        game_level: gameActiveLevel
                    })
                });

                
                const res = await response.json();
                if (res.status !== 'success') {
                    console.error('API Error:', res.message);
                    alert(`Error: ${res.message}`);
                    return;
                }
                
                const data = res.data; 
                activeBatchTokens = data.tokens || [];  
                debugLog("Fetched new word batch from API:", activeBatchTokens);

                // Game Over handling when level batch runs out
                if (activeBatchTokens.length === 0) {
                    if (!gameCompletedLevels.includes(gameActiveLevel)) {
                        gameCompletedLevels.push(gameActiveLevel);
                        await saveGameState(gameActiveLevel, matchScore, gameCompletedLevels);
                    }

                    showGameOverGui();
                    return;

                }

                startMatchingGameRound();

            } catch (error) {
                console.error("Error fetching word batch from server:", error);
            }
        }

        // called from GAME OVER SCREEN and user wants to play the level again. 
        // we need to reset game state so we can bring in new words 
        // we need to update game state 
        // - set current level and remove completed levels 

        async function restartCurrentLevel() {

            try {

                document.getElementById('game-over-overlay').classList.add('hidden');

                  const response = await fetch('/boa/v1/game/level/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_uuid: sessionUuid,
                        game_name: "TILE_MATCH",
                        game_level: gameActiveLevel
                    })
                });

                const res = await response.json();
                if (res.status !== 'success') {
                    console.error('API Error:', res.message);
                    alert(`Error: ${res.message}`);
                    return;
                }

                debugLog("Game LEVEL RESET is success");

                // Reset score and strip out active level from completed list
                matchScore = 0;
                gameCompletedLevels = gameCompletedLevels.filter(lvl => lvl !== gameActiveLevel);
                // Save state with updated score and filtered levels
                await saveGameState(gameActiveLevel, matchScore, gameCompletedLevels);
                debugLog("saved game state with modified finished levels...");

                // play again 
                fetchNextBatchAndPlay();

            }catch (err) {
                console.error("Error doing GAME RESET :", err);
                alert(`Failed to reset game level: ${err.message}`);
            }
            
        }


        // --- Game Over Overlay Controls ---
        function showGameOverGui() {
            document.getElementById('game-over-level-num').innerText = gameActiveLevel;
            document.getElementById('game-over-final-score').innerText = matchScore;
            document.getElementById('game-over-overlay').classList.remove('hidden');
            // playDisappointingSound();
        }


        function selectLevelFromGameOver() {
            document.getElementById('game-over-overlay').classList.add('hidden');
            showLevelSelectGui();
        }

        function updateHeaderUI() {
            document.getElementById('match-score-display').innerText = matchScore;
            document.getElementById('current-level-display').innerText = gameActiveLevel;
        }

        // --- Audio FX ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTileClickSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(850, now + 0.05);
            gainNode.gain.setValueAtTime(0.12, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
        }

        function playClapSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + (index * 0.08));
                gainNode.gain.setValueAtTime(0.2, now + (index * 0.08));
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + (index * 0.08) + 0.15);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start(now + (index * 0.08));
                osc.stop(now + (index * 0.08) + 0.15);
            });
        }

        function playDisappointingSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now); 
            osc.frequency.linearRampToValueAtTime(90, now + 0.5); 
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
        }

        function getCardBaseClass(type) {
            if (type === 'hindi') {
                return "game-btn bg-slate-900 hover:bg-slate-800 text-cyan-300 font-bold border-2 border-cyan-400 border-b-4 rounded-xl p-3 text-base shadow-md cursor-pointer flex items-center justify-center min-h-[70px]";
            } else {
                return "game-btn bg-slate-900 hover:bg-slate-800 text-yellow-300 font-bold border-2 border-yellow-400 border-b-4 rounded-xl p-3 text-base shadow-md cursor-pointer flex items-center justify-center min-h-[70px]";
            }
        }

        // --- Step 3: Game Board Setup ---
        function startMatchingGameRound() {
            pairsFound = 0;
            selectedCards = [];

            updateHeaderUI();
            document.getElementById('match-pairs-count').innerText = pairsFound;

            const cardsArray = [];
            activeBatchTokens.forEach((hindiWord, index) => {
                const englishMeanings = wordDictionary[hindiWord] || ["Translation"];
                const randomEnglish = englishMeanings[Math.floor(Math.random() * englishMeanings.length)];
                
                cardsArray.push({ id: index, token: hindiWord, type: 'hindi', text: hindiWord });
                cardsArray.push({ id: index, token: hindiWord, type: 'english', text: randomEnglish });
            });

            const shuffledCards = cardsArray.sort(() => 0.5 - Math.random());
            renderMatchingGrid(shuffledCards);
        }

        function renderMatchingGrid(cards) {
            const board = document.getElementById('matching-grid-board');
            board.innerHTML = "";

            cards.forEach(card => {
                const btn = document.createElement('button');
                btn.className = getCardBaseClass(card.type);
                btn.innerText = card.text;

                btn.onclick = () => handleCardClick(card, btn);
                board.appendChild(btn);
            });
        }

        // --- Step 4: Click & Match Logic ---
        function handleCardClick(cardData, buttonElement) {
            if (selectedCards.length >= 2 || buttonElement.classList.contains('matched') || (selectedCards.length === 1 && buttonElement === selectedCards[0].element)) return;

            playTileClickSound();

            buttonElement.className = "game-btn bg-slate-800 text-white font-extrabold border-2 border-white border-b-4 rounded-xl p-3 text-base shadow-md cursor-pointer flex items-center justify-center min-h-[70px] glow-white";
            selectedCards.push({ data: cardData, element: buttonElement });

            if (selectedCards.length === 2) {
                const [card1, card2] = selectedCards;

                if (card1.data.id === card2.data.id && card1.data.type !== card2.data.type) {
                    // Match Correct
                    matchScore += 5;
                    pairsFound++;
                    playClapSound();

                    const hindiCard = card1.data.type === 'hindi' ? card1 : card2;
                    const englishCard = card1.data.type === 'english' ? card1 : card2;

                    englishCard.element.remove();

                    hindiCard.element.innerText = `${hindiCard.data.text} = ${englishCard.data.text}`;
                    hindiCard.element.className = "game-btn bg-slate-900 text-emerald-400 border-2 border-emerald-500 rounded-xl p-3 font-black text-lg text-center shadow matched col-span-2 flex items-center justify-center min-h-[70px]";

                    updateHeaderUI();
                    document.getElementById('match-pairs-count').innerText = pairsFound;

                    if (pairsFound === activeBatchTokens.length) {
                        saveGameState(gameActiveLevel, matchScore);
                        document.getElementById('match-victory-screen').classList.remove('hidden');
                    }

                    selectedCards = [];

                } else {
                    // Match Incorrect
                    matchScore -= 2;
                    playDisappointingSound();

                    selectedCards.forEach(card => {
                        card.element.className = "game-btn bg-rose-950 text-rose-400 border-2 border-rose-600 rounded-xl p-3 font-bold text-center shadow flex items-center justify-center min-h-[70px]";
                    });

                    setTimeout(() => {
                        selectedCards.forEach(card => {
                            card.element.className = getCardBaseClass(card.data.type);
                        });
                        selectedCards = [];
                    }, 800);
                }

                updateHeaderUI();
            }
        }

        // Initialize application
        initGame();
    </script>
</body>
</html>
