<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Matching Quest</title>
     <!-- Rock-solid Play CDN script for direct browser execution -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .game-btn { 
            transition: transform 0.1s ease, background-color 0.1s ease, border-color 0.1s ease; 
        }
        .game-btn:active { 
            transform: scale(0.95); 
        }
        /* Lock pointer events for disabled matched buttons */
        .matched {
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-purple-100 to-indigo-200 min-h-screen flex flex-col items-center justify-center font-sans p-4">

    <!-- MATCHING GAME DASHBOARD CONTAINER -->
    <div id="matching-game-card" class="bg-white rounded-3xl shadow-2xl p-6 max-w-xl w-full text-center border-4 border-indigo-400">
        
        <!-- Top Bar Status Row -->
        <div class="flex justify-between items-center mb-6">
            <span class="text-lg font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                Score: <span id="match-score-display">0</span>
            </span>
            <span class="text-sm font-semibold text-gray-400">
                Pairs Matched: <span id="match-pairs-count">0</span> / 6
            </span>
        </div>

        <!-- Instructions Banner -->
        <div class="mb-6">
            <h2 class="text-2xl font-extrabold text-gray-800 tracking-tight">Vocabulary Match</h2>
            <p class="text-gray-500 text-sm mt-1">Connect the Hindi words with their correct English meanings!</p>
        </div>

        <!-- The 12-Card Responsive Layout Board (3 columns on small, 4 columns on large devices) -->
        <div id="matching-grid-board" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 min-h-[300px] mb-4">
            <!-- Dynamically injected JS cards go here -->
        </div>


        <!-- Completion Screen (hidden until all are matched) -->
        <div id="match-victory-screen" class="hidden mt-6 p-4 bg-green-100 rounded-2xl border-2 border-green-400 text-center">
            <h3 class="text-2xl font-bold text-green-800 mb-2">🎉 Perfect Match!</h3>
            <button onclick="startMatchingGameRound()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-xl shadow transition cursor-pointer">
                Play Again
            </button>
        </div>
    </div>

    <script>
        let allWords = [];
        let selectedCards = []; 
        let matchScore = 0;
        let pairsFound = 0;
        let audioCtx = null;

        // Fetch words.json
        async function loadVocabulary() {
            try {
                const response = await fetch('words.json');
                allWords = await response.json();
                startMatchingGameRound();
            } catch (error) {
                console.error("Failed to load words.json file:", error);
            }
        }

        // --- Audio Functions ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playClapSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + (index * 0.08));
                gainNode.gain.setValueAtTime(0.2, now + (index * 0.08));
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + (index * 0.08) + 0.15);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start(now + (index * 0.08));
                osc.stop(now + (index * 0.08) + 0.15);
            });
        }

        function playDisappointingSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now); 
            osc.frequency.linearRampToValueAtTime(90, now + 0.5); 
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
        }

        // --- Game Logic ---
        function startMatchingGameRound() {
            matchScore = 0;
            pairsFound = 0;
            selectedCards = [];

            document.getElementById('match-score-display').innerText = matchScore;
            document.getElementById('match-pairs-count').innerText = pairsFound;
            document.getElementById('match-victory-screen').classList.add('hidden');

            // Pick exactly 6 random pairs instead of 5
            const selectedPairs = [...allWords].sort(() => 0.5 - Math.random()).slice(0, 6);

            // Create flat list of 12 card objects
            const cardsArray = [];
            selectedPairs.forEach((item, index) => {
                const randomEnglish = item.english_synonyms[Math.floor(Math.random() * item.english_synonyms.length)];
                cardsArray.push({ id: index, type: 'hindi', text: item.hindi });
                cardsArray.push({ id: index, type: 'english', text: randomEnglish });
            });

            // Shuffle cards
            const shuffledCards = cardsArray.sort(() => 0.5 - Math.random());
            renderMatchingGrid(shuffledCards);
        }


        function renderMatchingGrid(cards) {
            const board = document.getElementById('matching-grid-board');
            board.innerHTML = "";

            cards.forEach(card => {
                const btn = document.createElement('button');
                btn.className = "game-btn bg-gray-50 hover:bg-indigo-50 text-gray-800 font-semibold border-2 border-gray-200 rounded-xl p-4 text-base shadow transition ease-out cursor-pointer flex items-center justify-center min-h-[70px]";
                btn.innerText = card.text;

                btn.onclick = () => handleCardClick(card, btn);
                board.appendChild(btn);
            });
        }

       
        function handleCardClick(cardData, buttonElement) {
            if (selectedCards.length >= 2 || buttonElement.classList.contains('matched') || (selectedCards.length === 1 && buttonElement === selectedCards[0].element)) return;

            // Highlight selected card visually
            buttonElement.className = buttonElement.className.replace('bg-gray-50', 'bg-indigo-100 border-indigo-600 text-indigo-950');
            selectedCards.push({ data: cardData, element: buttonElement });

            if (selectedCards.length === 2) {
                const [card1, card2] = selectedCards;

                if (card1.data.id === card2.data.id && card1.data.type !== card2.data.type) {
                    // Match Correct
                    matchScore += 5;
                    pairsFound++;
                    playClapSound();
                    
                    // Identify which card is Hindi and which is English to order them nicely
                    const hindiCard = card1.data.type === 'hindi' ? card1 : card2;
                    const englishCard = card1.data.type === 'english' ? card1 : card2;

                    // Remove the English card element entirely from the DOM grid layout
                    englishCard.element.remove();

                    // Transform the Hindi card into a merged double-width display banner
                    hindiCard.element.innerText = `${hindiCard.data.text} = ${englishCard.data.text}`;
                    // Add 'col-span-2' so it merges across grid cells nicely, and lock it
                    hindiCard.element.className = "game-btn bg-emerald-500 text-white border-2 border-emerald-700 rounded-xl p-4 font-bold text-lg text-center shadow matched col-span-2 transition-all duration-300";

                    document.getElementById('match-score-display').innerText = matchScore;
                    document.getElementById('match-pairs-count').innerText = pairsFound;

                    if (pairsFound === 6) {
                        document.getElementById('match-victory-screen').classList.remove('hidden');
                    }
                    selectedCards = [];
                } else {
                    // Match Wrong
                    matchScore -= 2;
                    playDisappointingSound();

                    selectedCards.forEach(card => {
                        card.element.className = "game-btn bg-red-500 text-white border-red-700 rounded-xl p-4 font-semibold text-center shadow";
                    });

                    setTimeout(() => {
                        selectedCards.forEach(card => {
                            card.element.className = "game-btn bg-gray-50 hover:bg-indigo-50 text-gray-800 font-semibold border-2 border-gray-200 rounded-xl p-4 text-base shadow transition ease-out cursor-pointer flex items-center justify-center min-h-[70px]";
                        });
                        selectedCards = [];
                    }, 1000);
                }
                document.getElementById('match-score-display').innerText = matchScore;
            }
        }


        // Initialize
        loadVocabulary();
    </script>
</body>
</html>
