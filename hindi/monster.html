<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Space Invaders</title>

    <!-- local copy of tailwind CDN script  -->
    <script src="/assets/tailwind.js"></script>

    <style>
        body { background-color: #020617 !important; color: #ffffff !important; }
        .hidden-fallback { display: none !important; }
        .ammo-slot { transition: all 0.15s ease; }
        .loaded-slot { transform: scale(1.05); }

        
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col items-center justify-center font-sans p-4 text-white overflow-hidden">

    <!-- GAME BOARD INTERFACE CONTAINER -->
    <div class="bg-slate-900 border-4 border-cyan-500 rounded-3xl shadow-2xl p-6 max-w-2xl w-full flex flex-col items-center">
        
       
        <!-- Score Dashboard Header -->
        <div class="w-full flex justify-between items-center mb-4 border-b border-slate-800 pb-3 gap-2">
            <!-- Left: Score -->
            <span class="text-xl font-black text-cyan-400 tracking-wider">SCORE: <span id="score-val">0</span></span>
            
            <!-- Right: Active Level Badge & Change Level Switcher -->
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400 font-bold tracking-widest bg-slate-950 px-3 py-1 rounded-md border border-slate-800 uppercase">
                    <span id="current-level-val" class="text-yellow-400 font-extrabold">ALL</span>
                </span>
                <button id="btn-change-level" class="text-xs bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 text-cyan-400 font-extrabold px-2.5 py-1 rounded-md border border-slate-700 transition cursor-pointer">
                    CHANGE
                </button>
            </div>
        </div>

        <!-- 2D Canvas Target Display Arena -->
        <canvas id="spaceCanvas" width="600" height="320" class="bg-black border-2 border-slate-700 rounded-2xl w-full shadow-inner"></canvas>

        <!-- Dynamic Rocket Loading Dock Instruction Banner -->
        <p class="text-slate-400 text-xs font-semibold my-4 uppercase tracking-widest text-center">
            Use touchpad to <span class="text-yellow-400 font-black"> <span class="text-cyan-400 font-black">Click</span> and fire launcher
        </p>

        <!-- Weapons Bay Configuration Bar -->
        <div id="weapons-bay" class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full">
            <!-- 4 Rocket silos dynamically mapped here -->
        </div>

       <!-- Level Selector Overlay Box -->
        <div id="level-select-box" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center text-center p-4 z-50">
            <div class="bg-slate-900 border-4 border-cyan-500 rounded-3xl p-8 max-w-md w-full shadow-2xl">
                <h1 class="text-3xl font-black text-cyan-400 mb-1 tracking-wider">SELECT LEVEL</h1>
                <p class="text-sm text-slate-400 mb-6 font-semibold">Choose word difficulty level to launch</p>
                
                <div id="level-buttons" class="grid grid-cols-1 gap-3">
                    <button data-source="level1" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                        <span class="font-extrabold text-cyan-300">Level 1</span>
                        <span class="text-xs text-slate-400 group-hover:text-slate-200">Easy Peasy Words</span>
                    </button>
                    <button data-source="level2" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                        <span class="font-extrabold text-cyan-300">Level 2</span>
                        <span class="text-xs text-slate-400 group-hover:text-slate-200">A little grunt</span>
                    </button>
                    <button data-source="level3" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                        <span class="font-extrabold text-cyan-300">Level 3</span>
                        <span class="text-xs text-slate-400 group-hover:text-slate-200">Some Heavy Lifting</span>
                    </button>
                    <button data-source="all" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                        <span class="font-extrabold text-yellow-400">All Levels</span>
                        <span class="text-xs text-slate-400 group-hover:text-slate-200">All that you need</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- GameOver Overlay Box -->
        <div id="gameover-box" class="hidden-fallback fixed inset-0 bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center text-center p-4 z-50">
            <div class="bg-slate-900 border-4 border-red-500 rounded-3xl p-8 max-w-sm w-full">
                <h1 class="text-4xl font-black text-red-500 mb-2 tracking-tighter">MISSION OVER</h1>
                <p class="text-xl text-slate-300 mb-6">Final Score: <span id="final-score" class="font-bold text-cyan-400">0</span></p>
                <button onclick="restartInvadersGame()" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-extrabold text-lg py-3 px-8 rounded-xl shadow-lg cursor-pointer transition">
                    Launch New Sortie
                </button>
            </div>
        </div>
    </div>

    <script>
        let allWords = [];
        let currentItem = null;
        let choiceOptions = [];
        let loadedIndex = null;
        let score = 0;
        let audioCtx = null;

        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        
        let ufo = { x: 300, y: 50, targetX: 300, width: 140, height: 40, speed: 2 };
        let activeRocket = null;
        let particleExplosions = [];

        // --- Sound Engine ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playClapSound() {
            initAudio(); if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + (index * 0.06));
                gainNode.gain.setValueAtTime(0.2, now + (index * 0.06));
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + (index * 0.06) + 0.12);
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                osc.start(now + (index * 0.06)); osc.stop(now + (index * 0.06) + 0.12);
            });
        }

        function playDisappointingSound() {
            initAudio(); if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.4);
            gainNode.gain.setValueAtTime(0.15, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.4);
        }

        // Declare the global empty Image container registry object
        const alienImg = new Image();
        // Map level identifiers to their corresponding JSON source files
        const levelMap = {
            'level1': 'db/words01.json',
            'level2': 'db/words02.json',
            'level3': 'db/words03.json',
            'all': 'db/words.json'
        };

        const levelNames = {
            'level1': 'LEVEL 1',
            'level2': 'LEVEL 2',
            'level3': 'LEVEL 3',
            'all': 'ALL'
        };


        let currentGameLevel = 'all';
        let gameLoopRunning = false;

        async function loadGameData(levelKey) {

            try {

                if (levelKey && levelMap[levelKey]) {
                    currentGameLevel = levelKey;
                }

                // Update the level indicator label in the HUD header
                const levelValElem = document.getElementById('current-level-val');
                if (levelValElem) {
                    levelValElem.innerText = levelNames[currentGameLevel] || currentGameLevel.toUpperCase();
                }

                const fileToFetch = levelMap[currentGameLevel] || levelMap['all'];
                // Fetch the vocabulary words JSON corresponding to active level key
                const response = await fetch(fileToFetch);
                allWords = await response.json();
                alienImg.src = 'monster.svg';
                restartInvadersGame();

            } catch (err) {
                console.error("Critical: Could not load game asset structures", err);
            }
        }

        function selectLevel(levelKey) {
            document.getElementById('level-select-box').classList.add('hidden-fallback');
            loadGameData(levelKey);
            
            if (!gameLoopRunning) {
                gameLoopRunning = true;
                requestAnimationFrame(gameLoop);
            }
        }

        // Event listener using data-source attribute for level key mapping
        document.getElementById('level-buttons').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-source]');
            if (btn) {
                const levelKey = btn.dataset.source; // e.g. "level1", "level2", "all"
                selectLevel(levelKey);
            }
        });

        // Event Listener: Change Level Button in HUD Header
        document.getElementById('btn-change-level').addEventListener('click', () => {
            // Re-open the level selection overlay box
            document.getElementById('level-select-box').classList.remove('hidden-fallback');
        });

        function restartInvadersGame() {
            score = 0;
            activeRocket = null;
            loadedIndex = null;
            particleExplosions = [];
            document.getElementById('score-val').innerText = score;
            document.getElementById('gameover-box').classList.add('hidden-fallback');
            nextTargetWave();
        }

        function nextTargetWave() {
            activeRocket = null;
            loadedIndex = null;
            
            currentItem = allWords[Math.floor(Math.random() * allWords.length)];
            const correctMeaning = currentItem.root_english[Math.floor(Math.random() * currentItem.root_english.length)];
            
            let wrongMeanings = allWords
                .filter(item => item.root !== currentItem.root)
                .map(item => item.root_english[Math.floor(Math.random() * item.root_english.length)]);
            wrongMeanings = [...new Set(wrongMeanings)].sort(() => 0.5 - Math.random()).slice(0, 3);
            
            choiceOptions = [correctMeaning, ...wrongMeanings].sort(() => 0.5 - Math.random());
            
            ufo.x = Math.random() * (canvas.width - ufo.width);
            ufo.targetX = Math.random() * (canvas.width - ufo.width);
            
            renderWeaponsBayUi();
        }

        function renderWeaponsBayUi() {
            const bay = document.getElementById('weapons-bay');
            bay.innerHTML = "";

            choiceOptions.forEach((optionText, idx) => {

                const isLoaded = loadedIndex === idx;
                const div = document.createElement('div');
                div.id = `silo-${idx}`;
                div.className = `ammo-slot border-2 p-3 rounded-xl text-center font-bold text-sm tracking-wide transition flex flex-col gap-1 items-center justify-center ${
                    isLoaded 
                    ? 'border-yellow-400 bg-slate-800 text-yellow-300 loaded-slot shadow-[0_0_15px_rgba(234,179,8,0.3)]' 
                    : 'border-slate-700 bg-slate-950 text-slate-400'
                }`;
                div.innerHTML = `
                    <span class="text-[10px] uppercase opacity-50 px-2 py-0.5 rounded bg-black/40 border border-slate-800">Slot ${idx + 1}</span>
                    <span class="truncate max-w-full text-base font-extrabold mt-1">${optionText}</span>
                `;

                div.addEventListener('click', () => {
                    // 1. Instantly set the selected slot
                    loadedIndex = idx;
                    
                    // 2. Instantly launch the rocket
                    if (loadedIndex !== null && !activeRocket) {
                        activeRocket = {
                            x: canvas.width / 2,
                            y: canvas.height - 30,
                            text: choiceOptions[loadedIndex],
                            speed: 7,
                            isDeflected: false,
                            deflectVx: 0,
                            deflectVy: 0
                        };
                        // Clear the load index and refresh the UI slots
                        loadedIndex = null;
                        renderWeaponsBayUi();
                    }
                });

                // For mobile devices, map the exact same logic to touch
                div.addEventListener('touchend', (e) => {
                    e.preventDefault(); // Prevents double-triggering a click event
                    div.click();        // Triggers the click block above
                });

                bay.appendChild(div);
            });
        }

        

        // --- Physics Engine & Core Render Loop ---
        function gameLoop() {
            updateGamePhysics();
            drawGameGraphics();
            requestAnimationFrame(gameLoop);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particleExplosions.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02,
                    color: color
                });
            }
        }

        function updateGamePhysics() {
            if (Math.abs(ufo.x - ufo.targetX) < 5) {
                ufo.targetX = Math.random() * (canvas.width - ufo.width);
            }
            ufo.x += (ufo.targetX > ufo.x ? 1 : -1) * ufo.speed;

            particleExplosions.forEach((p, idx) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
                if (p.alpha <= 0) particleExplosions.splice(idx, 1);
            });

            if (activeRocket) {
                if (!activeRocket.isDeflected) {
                    activeRocket.y -= activeRocket.speed;

                    if (activeRocket.y <= ufo.y + ufo.height && activeRocket.y >= ufo.y) {
                        if (activeRocket.x >= ufo.x && activeRocket.x <= ufo.x + ufo.width) {
                            if (currentItem.root_english.includes(activeRocket.text)) {
                                score += 5;
                                document.getElementById('score-val').innerText = score;
                                playClapSound();
                                createExplosion(activeRocket.x, activeRocket.y, '#10b981');
                                nextTargetWave();
                            } else {
                                score -= 2;
                                document.getElementById('score-val').innerText = score;
                                playDisappointingSound();
                                createExplosion(activeRocket.x, activeRocket.y, '#ef4444');
                                
                                activeRocket.isDeflected = true;
                                activeRocket.deflectVx = (Math.random() > 0.5 ? 4 : -4);
                                activeRocket.deflectVy = 5;
                            }
                        }
                    }

                    if (activeRocket && activeRocket.y < 0) {
                        activeRocket = null;
                    }
                }
                else {
                        activeRocket.x += activeRocket.deflectVx;
                        activeRocket.y += activeRocket.deflectVy;

                        if (activeRocket.y > canvas.height || activeRocket.x < 0 || activeRocket.x > canvas.width) {
                            activeRocket = null;
                        }
                    }
                }
            }

            
            function drawGameGraphics() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 1. Draw deep space background stars twinkling matrix profile
                ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
                for (let i = 0; i < 15; i++) {
                    let sX = (Math.sin(Date.now() * 0.001 + i) * 0.5 + 0.5) * canvas.width;
                    ctx.fillRect(sX, (i * 22) % canvas.height, 2, 2);
                }

                // 2. Render the Retro SVG Arcade Alien Ship Matrix
                // ADDED: Check naturalWidth to safely skip if the file is missing or broken
                if (alienImg.complete && alienImg.naturalWidth !== 0) {
                    ctx.drawImage(alienImg, ufo.x, ufo.y, ufo.width, ufo.height);
                } else {
                    // Simple neon fallback block in case image hasn't loaded yet
                    ctx.fillStyle = "#a855f7";
                    ctx.fillRect(ufo.x, ufo.y, ufo.width, ufo.height);
                }

                // 3. Print Central Target Display Word (Hindi prompt text shifted lower)
                ctx.fillStyle = "#ffffff";
                ctx.shadowColor = "black";
                ctx.shadowBlur = 6;
                ctx.font = "bold 22px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                
                // FIXED: Changed from (ufo.height / 2) to adding + 12 pixels to push text lower
                ctx.fillText(currentItem ? currentItem.root : "", ufo.x + (ufo.width / 2), ufo.y + (ufo.height / 2) + 15);
                ctx.shadowBlur = 0; // Turn off shadows for other game assets


                // 4. Draw Base Weapon Defense Turret Gun Emplacement Matrix Platform
                ctx.fillStyle = "#1e293b";
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height + 10, 45, Math.PI, 0, false);
                ctx.fill();
                ctx.fillStyle = "#64748b";
                ctx.fillRect(canvas.width / 2 - 6, canvas.height - 35, 12, 25);

                // 5. Draw Launched Projectile Missile Engine Flare Core Profile
                if (activeRocket) {
                    ctx.fillStyle = activeRocket.isDeflected ? "#ef4444" : "#eab308";
                    ctx.beginPath();
                    ctx.arc(activeRocket.x, activeRocket.y, 8, 0, Math.PI * 2);
                    ctx.fill();

                    // Projectile Meaning Data Text Flag String banner tracking overlay
                    ctx.fillStyle = "#f8fafc";
                    ctx.font = "12px sans-serif";
                    ctx.fillText(activeRocket.text, activeRocket.x, activeRocket.y - 16);
                }

                // 6. Render Active Explosive Micro Particle Fields
                particleExplosions.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }

    
            // loadGameData();
            alienImg.src = 'monster.svg';

        </script>
    </body>
</html>
