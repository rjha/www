<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Space Invaders</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
    <!-- Apple Touch Icon for iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
    <!-- Web Manifest -->
    <link rel="manifest" href="/assets/favicon/site.webmanifest">
    
    <!-- local copy of tailwind CDN script  -->
    <script src="/assets/tailwind.js"></script>

    <style>
        body { background-color: #020617 !important; color: #ffffff !important; }
        .hidden-fallback { display: none !important; }
        .ammo-slot { transition: all 0.15s ease; }
        .loaded-slot { transform: scale(1.05); }

        
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col items-center justify-center font-sans p-4 text-white overflow-hidden">

    <!-- GAME BOARD INTERFACE CONTAINER -->
    <div class="bg-slate-900 border-4 border-cyan-500 rounded-3xl shadow-2xl p-6 max-w-2xl w-full flex flex-col items-center">
        
       
        <!-- Score Dashboard Header -->
        <div class="w-full flex justify-between items-center mb-4 border-b border-slate-800 pb-3 gap-2">
            <!-- Left: Score -->
            <span class="text-xl font-black text-cyan-400 tracking-wider">SCORE: <span id="total-score-val">0</span></span>
            
            <!-- Right: Active Level Badge & Change Level Switcher -->
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400 font-bold tracking-widest bg-slate-950 px-3 py-1 rounded-md border border-slate-800 uppercase">
                    <span id="current-level-val" class="text-yellow-400 font-extrabold">ALL</span>
                </span>
                <button id="btn-change-level" class="text-xs bg-slate-800 hover:bg-cyan-500 hover:text-slate-950 text-cyan-400 font-extrabold px-2.5 py-1 rounded-md border border-slate-700 transition cursor-pointer">
                    CHANGE
                </button>
            </div>
        </div>

        <!-- 2D Canvas Target Display Arena -->
        <canvas id="spaceCanvas" width="600" height="320" class="bg-black border-2 border-slate-700 rounded-2xl w-full shadow-inner"></canvas>

        <!-- Dynamic Rocket Loading Dock Instruction Banner -->
        <p class="text-slate-400 text-xs font-semibold my-4 uppercase tracking-widest text-center">
            Use touchpad to <span class="text-yellow-400 font-black"> <span class="text-cyan-400 font-black">Click</span> and fire launcher
        </p>

        <!-- Weapons Bay Configuration Bar -->
        <div id="weapons-bay" class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full">
            <!-- 4 Rocket silos dynamically mapped here -->
        </div>

       <!-- Level Selector Overlay Box -->
        <div id="level-select-box" class="fixed inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center text-center p-4 z-50">
            <div class="bg-slate-900 border-4 border-cyan-500 rounded-3xl p-8 max-w-md w-full shadow-2xl">
                <h1 class="text-3xl font-black text-cyan-400 mb-1 tracking-wider">SELECT LEVEL</h1>
                <p class="text-sm text-slate-400 mb-6 font-semibold">Choose word difficulty level to launch</p>
                
                <div id="level-buttons" class="grid grid-cols-1 gap-3">
                    <button data-source="level1" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                        <span class="font-extrabold text-cyan-300">Level 1</span>
                        <span class="text-xs text-slate-400 group-hover:text-slate-200">Easy Peasy Words</span>
                    </button>
                    <button data-source="level2" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                        <span class="font-extrabold text-cyan-300">Level 2</span>
                        <span class="text-xs text-slate-400 group-hover:text-slate-200">A little grunt</span>
                    </button>
                    <button data-source="level3" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                        <span class="font-extrabold text-cyan-300">Level 3</span>
                        <span class="text-xs text-slate-400 group-hover:text-slate-200">Some Heavy Lifting</span>
                    </button>
                    <button data-source="level4" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                        <span class="font-extrabold text-cyan-300">Level 4</span>
                        <span class="text-xs text-slate-400 group-hover:text-slate-200">Master class</span>
                    </button>

                    <button data-source="all" class="bg-slate-950 border-2 border-slate-700 hover:border-cyan-400 hover:bg-slate-800 p-3 rounded-xl transition flex justify-between items-center cursor-pointer text-left group">
                        <span class="font-extrabold text-yellow-400">All Levels</span>
                        <span class="text-xs text-slate-400 group-hover:text-slate-200">All that you need</span>
                    </button>
                </div>
            </div>
        </div>

    <!-- GameOver / Level Complete Overlay Box -->
    <div id="gameover-box" class="hidden-fallback fixed inset-0 bg-black/85 backdrop-blur-sm flex flex-col items-center justify-center text-center p-4 z-50">
        <div class="bg-slate-900 border-4 border-yellow-500 rounded-3xl p-8 max-w-sm w-full shadow-2xl">
            <!-- Dynamic Level Title -->
            <h1 id="gameover-title" class="text-3xl font-black text-yellow-400 mb-1 tracking-wider uppercase">LEVEL OVER</h1>
            <p id="gameover-subtitle" class="text-xs text-slate-400 mb-4 font-semibold uppercase tracking-widest">All words completed!</p>
            
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 mb-6">
                <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">Final Score</p>
                <p id="final-score" class="text-4xl font-black text-cyan-400">0</p>
            </div>

            <div class="flex flex-col gap-4">
                 <!-- Safe Action: Change Level -->
                <button onclick="openLevelSelect()" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 font-extrabold text-sm py-3 px-6 rounded-xl border border-slate-700 cursor-pointer transition">
                    SELECT LEVEL
                </button>

                <!-- Danger Action Group -->
                <div class="flex flex-col gap-1.5">
                    <button onclick="restartLevelWithReset()" class="bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-extrabold text-sm py-3 px-6 rounded-xl shadow-lg border border-rose-500/50 cursor-pointer transition flex items-center justify-center gap-2">
                        PLAY AGAIN
                    </button>
                    <!-- Warning Notice Subtext -->
                    <p class="text-[12px] text-rose-400/90 font-medium leading-tight px-1">
                        ⚠️ THIS WILL ERASE LEVEL DATA
                    </p>
                </div>
                
               
            </div>
        </div>
    </div>


    <script>


        const BATCH_SIZE = 20;
        // Parse query params initialized by index.html
        const urlParams = new URLSearchParams(window.location.search);
        let sessionUuid = urlParams.get('session_uuid');
        const PAGE_DEBUG = urlParams.get('page_debug') === '1';

        // Define macro-like logging wrappers
        const debugLog = PAGE_DEBUG ? console.log.bind(console, '[DEBUG]') : () => {};
        
        // Guard clause: redirect if session_uuid isn't present
        if (!sessionUuid) {
            window.location.href = "/hindi/index.html";
        }

        let gameActiveLevel = 1;
        let gameCompletedLevels = [];
        let batchWords = [];
        let wordPointer = 0;
        let totalScore = 0;
        let targetEnglishToken = "";
        let currentWord = null;
        let choiceOptions = [];
        let loadedIndex = null;
        let isFetchingBatch = false;

        const levelNames = {
            'level1': 'LEVEL 1',
            'level2': 'LEVEL 2',
            'level3': 'LEVEL 3',
            'level4': 'LEVEL 4',
            'all': 'ALL'
        };

         const levelValues = {
            'level1': '1',
            'level2': '2',
            'level3': '3',
            'level4': '4'
            // @todo missing ALL 
        };


        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        
        let ufo = { x: 300, y: 50, targetX: 300, width: 140, height: 40, speed: 2 };
        let activeRocket = null;
        let particleExplosions = [];

        let screenShakeTimer = 0;
        let deflectionFlashTimer = 0;
        // UFO Shield Aura 
        let ufoWarpScale = 1.0;
        let isWarpingIn = false;
    
        // --- Retro Starfield Background Data ---
        const stars = Array.from({ length: 25 }, () => ({
            x: Math.random() * 600,
            y: Math.random() * 320,
            speed: Math.random() * 2 + 0.8,
            length: Math.random() * 4 + 2,
            alpha: Math.random() * 0.7 + 0.3
        }));

        function triggerScreenShake(duration = 10) {
            screenShakeTimer = duration;
        }

        function triggerDeflectionFlash(duration = 12) {
            deflectionFlashTimer = duration;
        }
        

        // --- Sound Engine ---
        const sfx = {
            clap_01: new Audio('sfx/clap_01.mp3'),
            crash_01: new Audio('sfx/crash_01.mp3'),
            hit_01: new Audio('sfx/hit_03.ogg'),
            miss_01: new Audio('sfx/miss_02.ogg'),
            loading_01: new Audio('sfx/loading_01.wav')
        };

        // Set volume levels
        sfx.loading_01.volume = 0.15;
        sfx.hit_01.volume = 0.40;
        sfx.miss_01.volume = 0.40;

        // Helper function for zero-lag overlapping SFX playback
        function playSfx(key) {
            if (sfx[key]) {
                const sound = sfx[key].cloneNode(true);
                sound.volume = sfx[key].volume;
                sound.play().catch(err => {
                    // Catches potential browser autoplay restriction policy blocks
                    console.warn(`Audio playback pending user interaction: ${key}`);
                });
            }
        }
        
        function playClapSound() {
            playSfx('hit_01');
        }

        function playDisappointingSound() {
            playSfx('miss_01');
        }
        
        // Declare the global empty Image container registry object
        const alienImg = new Image();
        let gameLoopRunning = false;
        let wordsDictionary = {};

        async function selectLevel(levelKey) {
            const rawVal = levelValues[levelKey] || "1";
            debugLog("game level selection changed to: ", rawVal);
            gameActiveLevel = parseInt(rawVal, 10);

            updateHudLevelBadge();
            document.getElementById('level-select-box').classList.add('hidden-fallback');

            // Save newly selected level state to API
            await saveGameState(gameActiveLevel, gameCompletedLevels);
            // Resets score/pointers, hides gameover box, and starts batch
            restartInvadersGame();

        }

        async function restartLevelWithReset() {

            debugLog("Resetting tracker words for session:", sessionUuid, "level:", gameActiveLevel);

            try {

                const res = await fetch('/boa/v1/game/level/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_uuid: sessionUuid,
                        game_name: "MONSTER",
                        game_level: gameActiveLevel
                    })
                });

                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(`Reset failed (${res.status}): ${errText}`);
                }

                debugLog("Progress reset successfully. Restarting level...");
                restartInvadersGame();

            } catch (err) {
                console.error("Error resetting level progress:", err);
                alert(`Failed to reset level progress: ${err.message}`);
            }
        }


        async function loadGameState() {
            try {
                const res = await fetch('/boa/v1/game/state/get', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_uuid: sessionUuid,
                        game_name: "MONSTER"
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data && data.game_data && data.game_data.currentLevel) {
                        gameActiveLevel = parseInt(data.game_data.currentLevel, 10);
                       // Hydrate doneLevels from DB, default to empty array if omitted
                        gameCompletedLevels = Array.isArray(data.game_data.finishedLevels) ? data.game_data.finishedLevels : [];
                        debugLog(`Load Game State: level=${gameActiveLevel}, completedLevels=`, gameCompletedLevels);
                        return true;
                    }
                }
            } catch (err) {
                console.error("Failed to load game state:", err);
            }

            return false; // No valid saved state found
        }

        async function saveGameState(currentLevel, finishedLevels = gameCompletedLevels) {

            try {
                const res = await fetch('/boa/v1/game/state/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_uuid: sessionUuid,
                        game_name: "MONSTER",
                        game_data: {
                            currentLevel: currentLevel,
                            finishedLevels: finishedLevels
                        }
                    })
                });

                if (!res.ok) {
                    console.error(`Failed to save game state. Status: ${res.status}`);
                } else {
                    debugLog(`Game state saved: currentLevel=${currentLevel}`);
                }
            } catch (err) {
                console.error("Error calling /state/save API:", err);
            }
        }


        async function initGame() {
            
            // load words.json dictionary
            if (Object.keys(wordsDictionary).length === 0) {
                try {
                    const res = await fetch('db/words.json');
                    const wordsList = await res.json();
                    
                    // Transform array into a lookup map keyed by "root"
                    wordsDictionary = wordsList.reduce((map, item) => {
                        map[item.root] = item;
                        return map;
                    }, {});
                    debugLog(`words.json loaded: ${Object.keys(wordsDictionary).length} words.`);
                } catch (err) {
                    console.error("Failed to load words.json dictionary:", err);
                    alert("Error loading words.json dictionary file.");
                    return;
                }
            }

            // 2. Fetch saved state
            const hasSavedState = await loadGameState();

            if (hasSavedState) {
                // Hide overlay and automatically start level from saved state
                document.getElementById('level-select-box').classList.add('hidden-fallback');
                updateHudLevelBadge();
                fetchNextBatchAndPlay();
            } else {
                // Show Level Select Overlay to force user choice
                document.getElementById('level-select-box').classList.remove('hidden-fallback');
            }

            if (!gameLoopRunning) {
                gameLoopRunning = true;
                requestAnimationFrame(gameLoop);
            }
        }

        async function fetchNextBatchAndPlay() {

            if (isFetchingBatch) {
                console.warn("Fetch already in progress. Skipping duplicate request.");
                return;
            }

            isFetchingBatch = true;
            
            
            try {

                // @todo get from API BASE URL 
                const res = await fetch('/boa/v1/game/words/next', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_uuid: sessionUuid,
                        game_name: "MONSTER",
                        game_level: gameActiveLevel,
                        batch_size: BATCH_SIZE
                    })
                });

                if (!res.ok) {
                    const rawText = await res.text();
                    throw new Error(`Server returned status ${res.status}: ${rawText}`);
                }
                
                const data = await res.json(); 
                const rawTokens = data.tokens;

                // Handles empty array returned when a level is exhausted
                if (!Array.isArray(rawTokens) || rawTokens.length === 0) {
                    debugLog("Level complete: API returned zero new tokens");
                    isFetchingBatch = false;
                    batchWords = [];
                    showLevelOverMessage();
                    return;
                }

                
                // for each token (sequence of chars) returned from the API,
                // load the word (object having token, english words, and 
                // hindi synonyms from words.json 
                batchWords = data.tokens.map(token => {
                    return wordsDictionary[token] || {
                        root: token,
                        level: gameActiveLevel,
                        root_english: ["Translation N/A"],
                        root_synonyms: []
                    };
                });

                // Lock release before firing wave
                isFetchingBatch = false;
                wordPointer = 0;
                displayNextWord();

            } catch (err) {
                isFetchingBatch = false;
                console.error("Fetch batch error:", err);
                alert(`Error loading words: ${err.message}`);
            }
        }

      

        function showLevelOverMessage() {
            // 1. Clear silos
            const bay = document.getElementById('weapons-bay');
            if (bay) bay.innerHTML = "";

            // 2. Set dynamic title (e.g., "LEVEL 3 OVER")
            const titleElem = document.getElementById('gameover-title');
            if (titleElem) {
                titleElem.innerText = `LEVEL ${gameActiveLevel} OVER`;
            }

            // 3. Hydrate score and reveal overlay
            document.getElementById('final-score').innerText = totalScore;
            document.getElementById('gameover-box').classList.remove('hidden-fallback');
            
            debugLog("Level Over triggered for level:", gameActiveLevel);
        }

        function openLevelSelect() {
            document.getElementById('gameover-box').classList.add('hidden-fallback');
            document.getElementById('level-select-box').classList.remove('hidden-fallback');
        }


        function updateHudLevelBadge() {
            const levelValElem = document.getElementById('current-level-val');
            if (levelValElem) {
                const foundKey = Object.keys(levelValues).find(k => parseInt(levelValues[k], 10) === gameActiveLevel);
                levelValElem.innerText = levelNames[foundKey] || `LEVEL ${gameActiveLevel}`;
            }

        }

        // Event listener for level buttons
        document.getElementById('level-buttons').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-source]');
            if (btn) {
                const levelKey = btn.dataset.source; // e.g. "level1", "level2", "all"
                selectLevel(levelKey);
            }
        });

        // Event Listener: Change Level Button in HUD Header
        document.getElementById('btn-change-level').addEventListener('click', () => {
            // Re-open the level selection overlay box
            document.getElementById('level-select-box').classList.remove('hidden-fallback');
        });

        function restartInvadersGame() {
            totalScore = 0;
            activeRocket = null;
            loadedIndex = null;
            particleExplosions = [];
            document.getElementById('total-score-val').innerText = totalScore;
            document.getElementById('gameover-box').classList.add('hidden-fallback');
            fetchNextBatchAndPlay();
        }

        
        function displayNextWord() {

            // check against empty batch or bad word pointer 
            if (!batchWords || batchWords.length === 0 || wordPointer >= batchWords.length) {
                showLevelOverMessage();
            }


            activeRocket = null;
            loadedIndex = null;
            
            ufoWarpScale = 0.05;
            isWarpingIn = true;

            // selected Word Object 
            currentWord = batchWords[wordPointer];

            // Pick correct english token for current word 
            // Math.random is to pick one out of multiple root_english tokens
            // for picking first english word in a deterministic fashion, 
            // use currentItem.root_english[0];
            targetEnglishToken = currentWord.root_english[Math.floor(Math.random() * currentWord.root_english.length)];
            debugLog("displayNextWord(), target english token => ", targetEnglishToken);

            // get 3 wrong answers from words.json 
            // pick words whose root_english does not include target english token 
            const wrongAnswers = Object.values(wordsDictionary)
                .filter(item => !item.root_english.includes(targetEnglishToken))
                .flatMap(item => item.root_english)
                .filter((value, index, self) => self.indexOf(value) === index)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3);

            //  Combine target token + 3 wrong answers and shuffle across 4 silos
            choiceOptions = [targetEnglishToken, ...wrongAnswers].sort(() => 0.5 - Math.random());
            
            ufo.x = Math.random() * (canvas.width - ufo.width);
            ufo.targetX = Math.random() * (canvas.width - ufo.width);

            renderWeaponsBayUi();
        }

    
       function renderWeaponsBayUi() {

            const bay = document.getElementById('weapons-bay');
            bay.innerHTML = "";

            choiceOptions.forEach((optionText, idx) => {
                const isLoaded = loadedIndex === idx;
                
                // Outer wrapper container for button + label
                const wrapper = document.createElement('div');
                wrapper.className = "flex flex-col items-center w-full gap-1.5";

                // Interactive Word Button (Bordered)
                const btn = document.createElement('div');
                btn.id = `silo-${idx}`;
                btn.className = `ammo-slot w-full border-2 p-3 rounded-xl text-center font-bold text-sm tracking-wide transition flex items-center justify-center cursor-pointer min-h-[64px] ${
                    isLoaded 
                    ? 'border-yellow-400 bg-slate-800 text-yellow-300 loaded-slot shadow-[0_0_15px_rgba(234,179,8,0.3)]' 
                    : 'border-slate-700 bg-slate-950 text-slate-400 hover:border-cyan-500 hover:text-slate-200'
                }`;

                btn.innerHTML = `
                    <span class="text-xs sm:text-sm font-extrabold text-white leading-tight break-words line-clamp-2">
                        ${optionText}
                    </span>
                `;

                // Simple Unbordered Label Below
                const label = document.createElement('span');
                label.className = "text-[10px] font-black tracking-widest text-cyan-400 uppercase font-mono opacity-80 select-none";
                label.innerText = `SLOT ${idx + 1}`;

                // Click / Touch Event Listeners
                btn.addEventListener('click', () => {
                    loadedIndex = idx;
                    
                    if (loadedIndex !== null && !activeRocket) {
                        // playLoadingSound();
                        activeRocket = {
                            x: canvas.width / 2,
                            y: canvas.height - 30,
                            text: choiceOptions[loadedIndex],
                            speed: 7,
                            isDeflected: false,
                            deflectVx: 0,
                            deflectVy: 0
                        };

                        loadedIndex = null;
                        renderWeaponsBayUi();
                    }
                });

                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    btn.click();
                });

                wrapper.appendChild(btn);
                wrapper.appendChild(label);
                bay.appendChild(wrapper);
            });
        }

        // Game Physics Engine & Core Render Loop
        function gameLoop() {
            updateGamePhysics();
            drawGameGraphics();
            requestAnimationFrame(gameLoop);
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particleExplosions.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02,
                    color: color
                });
            }
        }

        function updateGamePhysics() {

            // Animate Warp Starfield Motion
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) {
                    s.y = 0;
                    s.x = Math.random() * canvas.width;
                }
            });

            // Animate UFO Warp-In Scale Expansion
            if (isWarpingIn) {
                ufoWarpScale += (1.0 - ufoWarpScale) * 0.15; // Smooth spring ease-out
                if (ufoWarpScale >= 0.98) {
                    ufoWarpScale = 1.0;
                    isWarpingIn = false;
                }
            }

            if (Math.abs(ufo.x - ufo.targetX) < 5) {
                ufo.targetX = Math.random() * (canvas.width - ufo.width);
            }
            ufo.x += (ufo.targetX > ufo.x ? 1 : -1) * ufo.speed;

            particleExplosions.forEach((p, idx) => {
                p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
                if (p.alpha <= 0) particleExplosions.splice(idx, 1);
            });

         
            if (activeRocket) {

                const flameColors = activeRocket.isDeflected 
                    ? ['#ef4444', '#b91c1c', '#6b7280'] // Red & Smoke for deflected rockets
                    : ['#f59e0b', '#eab308', '#ef4444']; // Orange, Yellow, Red fire for normal rockets

                for (let i = 0; i < 3; i++) {
                    particleExplosions.push({
                        x: activeRocket.x + (Math.random() - 0.5) * 6,
                        y: activeRocket.y + 10, // Spawn just below rocket head
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: activeRocket.isDeflected ? (Math.random() - 0.5) * 2 : Math.random() * 3 + 1, // Trail downward
                        radius: Math.random() * 3.5 + 1.5,
                        alpha: 0.9,
                        decay: Math.random() * 0.05 + 0.03,
                        color: flameColors[Math.floor(Math.random() * flameColors.length)]
                    });
                }


                if (!activeRocket.isDeflected) {
                    activeRocket.y -= activeRocket.speed;

                    if (activeRocket.y <= ufo.y + ufo.height && activeRocket.y >= ufo.y) {
                        if (activeRocket.x >= ufo.x && activeRocket.x <= ufo.x + ufo.width) {

                            debugLog("target english token: ", targetEnglishToken, "rocket text:", activeRocket.text);
                            
                            // Process Right or Wrong Answer 
                            if (activeRocket.text === targetEnglishToken) {
                            
                                totalScore += 5;
                                document.getElementById('total-score-val').innerText = totalScore;
                                playClapSound();
                                createExplosion(activeRocket.x, activeRocket.y, '#10b981');
                                // Trigger Screen Shake on Hit
                                triggerScreenShake(12);
                                wordPointer += 1 ;
                                
                                if (wordPointer >= batchWords.length) {
                                    fetchNextBatchAndPlay();
                                } else {
                                    displayNextWord();
                                }

                               

                            } else {
                                totalScore -= 2;
                                document.getElementById('total-score-val').innerText = totalScore;
                                playDisappointingSound();
                                
                                createExplosion(activeRocket.x, activeRocket.y, '#ef4444');
                                // Trigger Red Deflection Flash on wrong answer
                                triggerDeflectionFlash(15);
                                activeRocket.isDeflected = true;
                                activeRocket.deflectVx = (Math.random() > 0.5 ? 4 : -4);
                                activeRocket.deflectVy = 5;
                            }
                            
                        }
                    }

                    if (activeRocket && activeRocket.y < 0) {
                        activeRocket = null;
                    }
                }
                else {
                        activeRocket.x += activeRocket.deflectVx;
                        activeRocket.y += activeRocket.deflectVy;

                        if (activeRocket.y > canvas.height || activeRocket.x < 0 || activeRocket.x > canvas.width) {
                            activeRocket = null;
                        }
                    }
                }
            }

            
            function drawGameGraphics() {

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                
                // Apply Screen Shake Offset
                if (screenShakeTimer > 0) {
                    const shakeX = (Math.random() - 0.5) * 10;
                    const shakeY = (Math.random() - 0.5) * 10;
                    ctx.translate(shakeX, shakeY);
                    screenShakeTimer--;
                }

                // Draw Animated Retro CRT Warp Starfield & Cyber Grid
                // Draw Warp Speed Stars with Neon Cyan Glow
                stars.forEach(s => {
                    ctx.fillStyle = `rgba(34, 211, 238, ${s.alpha})`; // Cyan neon glow
                    ctx.fillRect(s.x, s.y, 2, s.length + s.speed); // Speed-stretched trails
                });

               
                // Draw Perspective Cyber Grid lines at canvas base
                const gridY = canvas.height - 70;
                ctx.strokeStyle = "rgba(6, 182, 212, 0.15)"; // Subdued cyan
                ctx.lineWidth = 1;

                // Horizontal Grid lines
                for (let y = gridY; y <= canvas.height; y += 12) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }

                // Perspective Vanishing Vertical Grid lines
                const centerX = canvas.width / 2;
                const vanishingY = gridY - 20;
                for (let x = -200; x <= canvas.width + 200; x += 40) {
                    ctx.beginPath();
                    ctx.moveTo(centerX, vanishingY);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }

                // Draw Red Deflection Flash Overlay on Border
                if (deflectionFlashTimer > 0) {
                    const alpha = (deflectionFlashTimer / 15) * 0.4; // Fades out
                    ctx.strokeStyle = `rgba(239, 68, 68, ${alpha})`;
                    ctx.lineWidth = 10;
                    ctx.strokeRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = `rgba(239, 68, 68, ${alpha * 0.3})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    deflectionFlashTimer--;
                }

                ctx.restore();               
                ctx.save();
                
                // Render Alien Ship with Pulsing Shield
                // Set transformation origin to center of UFO
                // Only draw UFO and Hindi word if batch is active
                // if (currentItem && batchWords.length > 0 && wordPointer < batchWords.length) {

                const ufoCenterX = ufo.x + (ufo.width / 2);
                const ufoCenterY = ufo.y + (ufo.height / 2);
                ctx.translate(ufoCenterX, ufoCenterY);
                ctx.scale(ufoWarpScale, ufoWarpScale);

                // Pulsing Energy Shield Aura
                const pulse = Math.sin(Date.now() * 0.005) * 5 + 12; // Continuous wave pulse
                ctx.shadowBlur = pulse;
                ctx.shadowColor = "#a855f7"; // Neon Purple Shield Glow

                // Outer Shield Ellipse Ring
                ctx.strokeStyle = "rgba(168, 85, 247, 0.6)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, 0, (ufo.width / 2) + 8, (ufo.height / 2) + 8, 0, 0, Math.PI * 2);
                ctx.stroke();

                // Draw Alien Ship SVG or Neon Fallback Box
                if (alienImg.complete && alienImg.naturalWidth !== 0) {
                    ctx.drawImage(alienImg, -ufo.width / 2, -ufo.height / 2, ufo.width, ufo.height);
                } else {
                    ctx.fillStyle = "#a855f7";
                    ctx.fillRect(-ufo.width / 2, -ufo.height / 2, ufo.width, ufo.height);
                }

                // Render Hindi Target Word inside/under UFO
                const textVal = currentWord ? currentWord.root : "";
                ctx.font = "bold 20px sans-serif";
                const textWidth = ctx.measureText(textVal).width;

                ctx.fillStyle = "rgba(2, 6, 23, 0.85)"; // High-contrast dark slate
                ctx.strokeStyle = "#22d3ee";            // Cyan border
                ctx.lineWidth = 1.5;

                ctx.beginPath();
                ctx.roundRect(-textWidth / 2 - 8, 2, textWidth + 16, 26, 6);
                ctx.fill();
                ctx.stroke();

                // 3. Render Hindi Target Word
                // ctx.fillStyle = "#fef08a"; // Bright yellow
                ctx.fillStyle = "#ffffff";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(textVal, 0, 15);  

                // }

                ctx.restore(); 

                // Draw Base Weapon Defense Turret Gun Emplacement Matrix Platform
                ctx.fillStyle = "#1e293b";
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height + 10, 45, Math.PI, 0, false);
                ctx.fill();
                ctx.fillStyle = "#64748b";
                ctx.fillRect(canvas.width / 2 - 6, canvas.height - 35, 12, 25);

                
                //  Draw Arcade Rocket Silhouette with Thruster Glow
                if (activeRocket) {
                    ctx.save();
                    
                    // Center origin on rocket position
                    ctx.translate(activeRocket.x, activeRocket.y);
                    
                    // Rotate rocket facing down if deflected, facing up if active
                    if (activeRocket.isDeflected) {
                        ctx.rotate(Math.atan2(activeRocket.deflectVy, activeRocket.deflectVx) - Math.PI / 2);
                    }

                    const glowColor = activeRocket.isDeflected ? "#ef4444" : "#22d3ee"; // Red if deflected, Cyan if flying
                    const bodyColor = activeRocket.isDeflected ? "#991b1b" : "#0f172a"; // Dark red body / Dark slate body

                    // Neon Thruster Glow Aura
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = glowColor;

                    // Rocket Fins (Left & Right)
                    ctx.fillStyle = glowColor;
                    // Left Fin
                    ctx.beginPath();
                    ctx.moveTo(-6, 8);
                    ctx.lineTo(-12, 14);
                    ctx.lineTo(-6, 14);
                    ctx.closePath();
                    ctx.fill();
                    // Right Fin
                    ctx.beginPath();
                    ctx.moveTo(6, 8);
                    ctx.lineTo(12, 14);
                    ctx.lineTo(6, 14);
                    ctx.closePath();
                    ctx.fill();

                    // Main Rocket Fuselage Body
                    ctx.fillStyle = bodyColor;
                    ctx.strokeStyle = glowColor;
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    ctx.moveTo(0, -16);              // Rocket Nose Tip
                    ctx.quadraticCurveTo(8, -4, 6, 12); // Right Curve
                    ctx.lineTo(-6, 12);               // Base
                    ctx.quadraticCurveTo(-8, -4, 0, -16); // Left Curve
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Glowing Nose Cone Cap
                    ctx.fillStyle = glowColor;
                    ctx.beginPath();
                    ctx.moveTo(0, -16);
                    ctx.quadraticCurveTo(4, -10, 4, -8);
                    ctx.lineTo(-4, -8);
                    ctx.quadraticCurveTo(-4, -10, 0, -16);
                    ctx.closePath();
                    ctx.fill();

                    // Hot Engine Nozzle Core
                    ctx.fillStyle = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(0, 12, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Floating Meaning Text Above Rocket
                    ctx.save();
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = "black";
                    ctx.fillStyle = "#f8fafc";
                    ctx.font = "bold 13px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(activeRocket.text, activeRocket.x, activeRocket.y - 24);
                    ctx.restore();
                }


                // Render Active Explosive Micro Particle Fields
                particleExplosions.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }

            alienImg.src = 'assets/ufo_01.png';
            // Run initialization on page load
            window.addEventListener('DOMContentLoaded', initGame);

        </script>
    </body>
</html>
