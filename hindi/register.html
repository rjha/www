<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hindi Arcade</title>
    <script src="/assets/tailwind.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800;900&display=swap');
        
        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #030712 !important;
            color: #ffffff !important;
        }

        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(6, 182, 212, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.12) 1px, transparent 1px);
            background-size: 36px 36px;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4 bg-grid-pattern">

    <div class="max-w-md w-full bg-slate-900 border-4 border-yellow-400 rounded-3xl p-8 shadow-2xl z-10">
        
        <h1 class="text-3xl font-black text-yellow-400 mb-6 tracking-wider uppercase text-center">REGISTER ACCOUNT</h1>

        <form onsubmit="handleRegistrationSubmit(event)" class="flex flex-col gap-4 text-left">
            
            <!-- Login Handle Input -->
            <div>
                <label for="reg-login-name" class="block text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">
                    🎮 LOGIN
                </label>
                <input type="text" id="reg-login-name" required placeholder="e.g. CALLSIGN123" 
                       minlength="6" maxlength="16" oninput="formatLoginInput(this)"
                       class="w-full bg-slate-950 border-2 border-slate-700 focus:border-yellow-400 rounded-xl p-3 text-yellow-300 font-bold placeholder-slate-600 focus:outline-none transition uppercase">
                <span class="text-[10px] text-slate-500 mt-1 block">6-16 characters, letters and numbers only.</span>
            </div>

            <!-- Display Name Input -->
            <div>
                <label for="reg-full-name" class="block text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">
                    👤 FULL NAME
                </label>
                <input type="text" id="reg-full-name" required placeholder="e.g. Rahul Sharma"
                       class="w-full bg-slate-950 border-2 border-slate-700 focus:border-yellow-400 rounded-xl p-3 text-cyan-300 font-bold placeholder-slate-600 focus:outline-none transition">
            </div>

            <!-- Error Banner -->
            <p id="reg-error" class="hidden text-xs font-bold text-red-400 bg-red-950/60 border border-red-800 rounded-lg p-2.5 text-center tracking-wide"></p>

            <!-- Submit Button -->
            <div class="flex flex-col gap-3 mt-4">
                <button type="submit" id="btn-reg-submit" 
                        class="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black py-3 rounded-xl border-b-4 border-yellow-600 active:border-b-0 uppercase tracking-wider transition cursor-pointer">
                    REGISTER
                </button>

                <button type="button" onclick="navigateToLogin()" 
                        class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl border border-slate-700 transition uppercase tracking-wider text-xs cursor-pointer">
                    CANCEL TO LOGIN
                </button>
            </div>
        </form>
    </div>

    <script>
        function getGameParam() {
            const params = new URLSearchParams(window.location.search);
            return params.get('game') || 'MONSTER';
        }

        function formatLoginInput(input) {
            input.value = input.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
        }

        function navigateToLogin() {
            const currentGame = getGameParam();
            window.location.href = `login.html?game=${currentGame}`;
        }

        async function handleRegistrationSubmit(e) {
            e.preventDefault();

            const loginElem = document.getElementById('reg-login-name');
            const loginName = loginElem.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
            loginElem.value = loginName;

            const fullName = document.getElementById('reg-full-name').value.trim();
            const submitBtn = document.getElementById('btn-reg-submit');

            if (loginName.length < 6 || loginName.length > 16) {
                showError("LOGIN HANDLE MUST BE BETWEEN 6 AND 16 CHARACTERS!");
                return;
            }

            if (!fullName) {
                showError("PLEASE ENTER A DISPLAY NAME!");
                return;
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "CREATING ACCOUNT...";

                const regRes = await fetch('/boa/v1/game/user/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: fullName, login_name: loginName })
                });

                const regData = await regRes.json();

                if (regRes.ok && regData.status === 'success') {
                    window.location.href = 'index.html';
                    return;
                }

                showError(regData.message || "FAILED TO REGISTER USER.");
                submitBtn.disabled = false;
                submitBtn.innerText = "REGISTER";

            } catch (err) {
                console.error("Registration Error:", err);
                showError("NETWORK ERROR. COULD NOT REACH SERVER.");
                submitBtn.disabled = false;
                submitBtn.innerText = "REGISTER";
            }
        }

        function showError(msg) {
            const errElem = document.getElementById('reg-error');
            errElem.innerText = msg;
            errElem.classList.remove('hidden');
        }
    </script>
</body>
</html>
