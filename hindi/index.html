<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindi Arcade Lander</title>
    <script src="/assets/tailwind.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800;900&display=swap');
        
        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #030712 !important;
            color: #ffffff !important;
        }

        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(6, 182, 212, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.12) 1px, transparent 1px);
            background-size: 36px 36px;
        }

        .game-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .game-card.selected {
            border-color: #06b6d4 !important;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.45);
            transform: translateY(-4px) scale(1.02);
        }

        .glow-title {
            text-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden bg-grid-pattern" onload="initLandingPage()">

    <!-- Ambient Glow Effects -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-72 h-72 bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-2xl w-full z-10 my-6">

        <!-- Arcade Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-300 to-cyan-400 tracking-wider uppercase glow-title italic leading-tight">
                HINDI LEARNING ARCADE
            </h1>
            <hr class="border-slate-800 my-2">
            <h2 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-yellow-400 tracking-wider uppercase glow-title italic">
                CHOOSE YOUR MISSION
            </h2>
            <p class="text-sm sm:text-base text-slate-300 font-bold mt-2 tracking-wide">
                Select a game to launch your vocabulary trainer!
            </p>
        </div>

        <!-- Active Session Status Banner -->
        <div id="session-banner" class="hidden mb-6 bg-slate-900/90 border border-cyan-500/50 rounded-2xl p-3 flex justify-between items-center px-5 shadow-lg backdrop-blur-md">
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">Active Session:</span>
                <span id="active-player-name" class="text-sm font-black text-cyan-300 tracking-wide uppercase"></span>
            </div>
            <button onclick="logoutSession()" class="text-xs text-yellow-400 hover:text-yellow-300 font-bold underline uppercase tracking-wider transition cursor-pointer">
                Sign Out
            </button>
        </div>

        <!-- Game Selection Grid -->
        <div class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <!-- Game 1: Space Invaders -->
                <div data-game="MONSTER" data-url="monster.html" data-title="SPACE INVADERS"
                     onclick="selectGame(this)" 
                     class="game-card selected cursor-pointer bg-slate-900 border-2 border-cyan-500 rounded-2xl overflow-hidden relative group shadow-lg">
                    
                    <div class="absolute top-3 left-3 bg-cyan-500 text-slate-950 text-[10px] font-black px-2.5 py-0.5 rounded-full z-20 shadow-md">
                        POPULAR
                    </div>

                    <div class="h-36 relative overflow-hidden bg-slate-950">
                        <img src="assets/ufo_01.png" alt="Space Invaders" class="w-full h-full object-contain p-4 group-hover:scale-110 transition duration-300">
                    </div>

                    <div class="p-4 border-t border-slate-800/80 bg-slate-900/90">
                        <h3 class="text-xl font-black text-cyan-300 tracking-wide uppercase">Space Invaders</h3>
                        <p class="text-xs text-slate-400 font-bold mt-1">Blast the UFO with correct word ammo!</p>
                    </div>
                </div>

                <!-- Game 2: TILE MATCH -->
                <div data-game="TILE_MATCH" data-url="match.html" data-title="TILE MATCH"
                     onclick="selectGame(this)" 
                     class="game-card cursor-pointer bg-slate-900 border-2 border-slate-800 hover:border-slate-600 rounded-2xl overflow-hidden relative group shadow-lg opacity-85 hover:opacity-100">
                    
                    <div class="absolute top-3 left-3 bg-yellow-400 text-slate-950 text-[10px] font-black px-2.5 py-0.5 rounded-full z-20 shadow-md">
                        IDLE MUSINGS
                    </div>

                    <div class="h-36 relative overflow-hidden bg-slate-950">
                        <img src="assets/letter_01.png" alt="Letter tile" class="w-full h-full object-contain p-4 group-hover:scale-110 transition duration-300">
                    </div>

                    <div class="p-4 border-t border-slate-800/80 bg-slate-900/90">
                        <h3 class="text-xl font-black text-yellow-400 tracking-wide uppercase">TILE MATCH</h3>
                        <p class="text-xs text-slate-400 font-bold mt-1">Match The English and Hindi Tiles</p>
                    </div>
                </div>

            </div>

            <!-- Hidden Game Tracking -->
            <input type="hidden" id="selected-game-name" value="MONSTER">
            <input type="hidden" id="selected-game-url" value="monster.html">

            <!-- Launch Button -->
            <button type="button" id="btn-launch" onclick="handleLaunchClick()"
                    class="w-full bg-gradient-to-r from-cyan-400 via-teal-400 to-cyan-500 hover:from-cyan-300 hover:to-teal-300 text-slate-950 font-black text-xl py-4 rounded-2xl transition duration-200 cursor-pointer shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_30px_rgba(6,182,212,0.7)] uppercase tracking-wider transform hover:-translate-y-0.5 active:translate-y-0">
                🚀 LAUNCH MISSION
            </button>
        </div>
    </div>

    <script>
        function initLandingPage() {
            const loginName = localStorage.getItem('boa_login_name');
            if (loginName) {
                document.getElementById('session-banner').classList.remove('hidden');
                document.getElementById('active-player-name').innerText = loginName;
            }
        }

        function selectGame(cardElement) {
            document.querySelectorAll('.game-card').forEach(card => {
                card.classList.remove('selected', 'border-cyan-500');
                card.classList.add('border-slate-800');
            });

            cardElement.classList.add('selected');
            cardElement.classList.remove('border-slate-800');

            document.getElementById('selected-game-name').value = cardElement.dataset.game;
            document.getElementById('selected-game-url').value = cardElement.dataset.url;
        }

        function handleLaunchClick() {
            const sessionUuid = localStorage.getItem('boa_session_uuid');
            const gameName = document.getElementById('selected-game-name').value;
            const targetUrl = document.getElementById('selected-game-url').value;

            if (sessionUuid) {
                window.location.href = `${targetUrl}?session_uuid=${sessionUuid}&game=${gameName}`;
            } else {
                window.location.href = `login.html?game=${gameName}`;
            }
        }

        function logoutSession() {
            localStorage.removeItem('boa_session_uuid');
            localStorage.removeItem('boa_login_name');
            document.getElementById('session-banner').classList.add('hidden');
        }
    </script>
</body>
</html>
