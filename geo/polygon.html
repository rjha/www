
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw Polygon to GeoJSON</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="/assets/geo/css/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet.draw CSS -->
    <link rel="stylesheet" href="/assets/geo/css/leaflet.draw.css" />

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 70vh; width: 100%; }
        #output-container { padding: 15px; height: 25vh; box-sizing: border-box; background: #f4f4f4; }
        textarea { width: 100%; height: 80%; margin-top: 5px; font-family: monospace; resize: none; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="output-container">
        <strong>GeoJSON Output:</strong>
        <textarea id="geojson-output" placeholder="Draw a polygon on the map to see its GeoJSON boundary here..."></textarea>
    </div>

    <!-- Leaflet JS -->
    <script src="/assets/geo/js/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet.draw JS -->
    <script src="/assets/geo/js/leaflet.draw.js"></script>

    <script>
        // 1. Initialize the map
        const map = L.map('map').setView([25.5941, 85.1376], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 3. Create a feature group to store the drawn shapes
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // 4. Initialize the draw control toolbar
        const drawControl = new L.Control.Draw({
            draw: {
                polygon: true,   // Enable polygon drawing
                polyline: false, // Disable lines
                rectangle: true, // Enable rectangles
                circle: false,   // Disable circles (not supported natively by GeoJSON)
                marker: false,   // Disable markers
                circlemarker: false
            },
            edit: {
                featureGroup: drawnItems // Allow editing/deleting of drawn shapes
            }
        });
        map.addControl(drawControl);

        // 5. Function to update the text area with GeoJSON data
        function updateGeoJSON() {
            const data = drawnItems.toGeoJSON();
            document.getElementById('geojson-output').value = JSON.stringify(data, null, 2);
        }

        // 6. Event listener: Triggered when a user finishes drawing a shape
        map.on(L.Draw.Event.CREATED, function (e) {
            const layer = e.layer;
            drawnItems.addLayer(layer); // Add shape to the map
            updateGeoJSON();            // Output the data
        });

        // 7. Event listeners: Triggered when shapes are edited or deleted
        map.on(L.Draw.Event.EDITED, updateGeoJSON);
        map.on(L.Draw.Event.DELETED, updateGeoJSON);
    </script>
</body>
</html>
