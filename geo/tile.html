<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>xstudio Freehand Polygon and Tiles Calculator on a Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="/assets/geo/css/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet.draw CSS -->
    <link rel="stylesheet" href="/assets/geo/css/leaflet.draw.css" />

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: sans-serif; 
            display: flex; 
            height: 100vh; 
        }

       #sidebar { 
            width: 360px; 
            padding: 15px; 
            box-sizing: border-box; 
            background: #f8f9fa; 
            border-right: 1px solid #ccc; 
            height: 100vh;
            overflow-y: auto;   /* Allows the sidebar itself to scroll if you make the textarea massive */
        }


        #map { 
            flex-grow: 1; 
            height: 100%; 
        }

        textarea { 
            width: 100%; 
            height: 180px; 
            font-family: monospace; 
            resize: vertical;    /* Enables vertical resizing */
            margin-bottom: 10px; 
            box-sizing: border-box;
        }

        button { 
            padding: 10px; 
            background: #28a745; 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 4px; 
            font-weight: bold; 
        }

        button:hover { 
            background: #218838; 
        }

        .result { 
            min-height: 120px;  
            max-height: 300px;   /* Prevents the results lists from getting infinitely long */
            overflow-y: auto;   
            background: white; 
            padding: 10px; 
            border: 1px solid #ddd; 
            margin-top: 10px; 
            font-family: monospace; 
            font-size: 13px; 
            box-sizing: border-box;
        }

        .zoom-display { 
            font-size: 16px; 
            margin: 10px 0; 
            padding: 5px; 
            background: #e9ecef; 
            border-left: 4px solid #007bff; 
        }

        .tile-list { 
            margin: 0; 
            padding-left: 20px; 
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 12px 0;
        }

        .input-row label {
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
        }

        .input-row input {
            width: 100px;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: monospace;
            text-align: right;
        }

        .button-wrapper {
            display: flex;
            justify-content: flex-end; /* Pushes child elements completely to the right */
            width: 100%;
            margin-bottom: 10px;       /* Preserves structural spacing above the next header */
        }



    </style>

    

</head>
<body>

    <div id="sidebar">
        
        
         <!-- altitude box -->
        <div class="input-row">
            <label for="altitude-input">Altitude (meters):</label>
            <input type="number" id="altitude-input" value="53" min="0" max="9000">
        </div>
        <h3>Polygon Coordinates</h3>
        <textarea id="polygon-input" placeholder="Paste array here... e.g., [[[lng, lat], [lng, lat], ...]]"></textarea>
        <div class="button-wrapper">
            <button onclick="loadCoordinates()">Reload Map</button>
        </div>
       
        <!-- xoom level -->
        <div class="zoom-display" id="current-zoom">Current Zoom: --</div>
        <div class="result" id="polygon-data">Display polygon area and tiles stats </div>

        <h3>Touching Tiles</h3>
        <div class ="result" id="tile-path">Display touching tile paths.</div>

    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="/assets/geo/js/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet.draw JS -->
    <script src="/assets/geo/js/leaflet.draw.js"></script>
    <script src="/assets/geo/js/turf.min.js"></script>

    <script>
        // Initialize Map centered on Patna area
        const map = L.map('map').setView([25.6, 85.1], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // --- NEW: Custom Red GridLayer to draw visible grid cells and XYZ labels ---
        const XYZGridLayer = L.GridLayer.extend({
            createTile: function (coords) {
                const tile = document.createElement('div');
                tile.style.outline = '1px solid rgba(255, 0, 0, 0.5)'; // Clean red lines
                tile.style.background = 'rgba(255, 0, 0, 0.02)'; // Subtle tint
                tile.style.display = 'flex';
                tile.style.flexDirection = 'column';
                tile.style.justifyContent = 'center';
                tile.style.alignItems = 'center';
                tile.style.color = '#cc0000';
                tile.style.fontWeight = 'bold';
                tile.style.fontSize = '11px';
                tile.style.fontFamily = 'monospace';
                tile.style.textShadow = '1px 1px 0 white, -1px -1px 0 white';
                
                // Print the corresponding XYZ context values directly on screen
                tile.innerHTML = `Z: ${coords.z}<br>X: ${coords.x}<br>Y: ${coords.y}`;
                return tile;
            }
        });
        new XYZGridLayer().addTo(map);
        // ------------------------------------------------------------------------

        // Feature group to manage our single drawn layer
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // Initialize the Draw Toolbar (Configured strictly for 1 Polygon only)
        const drawControl = new L.Control.Draw({
            draw: {
                polygon: {
                    allowIntersection: false,
                    showArea: true,
                    shapeOptions: { color: "#007bff", weight: 3, fillOpacity: 0.2 }
                },
                polyline: false,
                circle: false,
                rectangle: false,
                marker: false,
                circlemarker: false
            },
            edit: {
                featureGroup: drawnItems,
                remove: true
            }
        });
        map.addControl(drawControl);

        let currentBounds = null;

        // Populate with your coordinate sample by default
        document.getElementById('polygon-input').value = JSON.stringify({
            "type": "Polygon",
            "coordinates": [
            [
                [85.074348, 25.601574],
                [85.097866, 25.618614],
                [85.126705, 25.607926],
                [85.124474, 25.587941],
                [85.100098, 25.582208],
                [85.081387, 25.574151],
                [85.074348, 25.601574]
            ]
        ]}, null, 2);

        // Standard Longitude to Tile conversion
        function lon2tile(lon, zoom) {
            return Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
        }

        // Standard Latitude to Tile conversion
        function lat2tile(lat, zoom) {
            return Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom));
        }

        function formatPolygonArea(areaM2) {

            // 1 Acre = 4046.8564224 m²
            // 1 Hectare = 10000 m²
            // 1 Sq Km = 1,000,000 m²
            
            let value = areaM2;
            let unit = "m²";

            if (areaM2 >= 1000000) { 
                value = areaM2 / 1000000;
                unit = "sq km";

            } else if (areaM2 >= 4046.86) { 
                // For medium agricultural scale sizes, 
                // use Acres and Hectares together
                const acres = areaM2 / 4046.8564224;
                const hectares = areaM2 / 10000;
                return {
                    value: `${acres.toFixed(2)} Acres (${hectares.toFixed(2)} ha)`,
                    unit: "" // Combined into value string
                };

            } else {
                // Tiny structural plots
                value = areaM2;
                unit = "sq m";
            }

            return {
                value: value.toLocaleString(undefined, { maximumFractionDigits: 2 }),
                unit: unit
            };
        }

        /** 
         * we cannot use static R (radius) number for the whole earth as the earth 
         * is flattened at the top and bottom. The length of one degree of latitude 
         * changes slightly from the equator to the poles because of that.
         * 
         * The length of one degree of longitude changes drastically because the lines 
         * of longitude converge at the poles. Here we convert 1 degree LAT/LON to meters 
         * using Standard WGS-84 Ellipsoid constants
         * 
        */
        
        function getGlobalMetricScales(centerLat) {

            const latRad = centerLat * Math.PI / 180;

            // Standard WGS-84 Ellipsoid constants
            const a = 6378137.0;          // Equatorial radius in meters
            const b = 6356752.314245;     // Polar radius in meters
            const eSq = 1 - (b * b) / (a * a); // Square of eccentricity

            // Calculate radius of curvature along the meridian (North-South)
            const denominator = Math.pow(1 - eSq * Math.sin(latRad) * Math.sin(latRad), 1.5);
            const M = (a * (1 - eSq)) / denominator;

            // Calculate radius of curvature along the prime vertical (East-West)
            const N = a / Math.sqrt(1 - eSq * Math.sin(latRad) * Math.sin(latRad));

            // Convert radian metrics 
            // cleanly to 1 Degree of movement on Earth
            const latToMeters = (Math.PI / 180) * M;
            const lngToMeters = (Math.PI / 180) * N * Math.cos(latRad);
            return { latToMeters, lngToMeters };

        }

        /** 
         * Azimuthal equdistant approximation using the center point of 
         * our polygon. For standard surveys, we use the UTM zone conversion 
         * factors. 
         */ 

        function calculatePlanarConvexArea(turfPolygonCoordinates) {

            if(!turfPolygonCoordinates 
                || turfPolygonCoordinates.length === 0) {
                return 0;
            }

            // Get the first coordinates array. 
            // We only store simple convex polygon data.
            const points = turfPolygonCoordinates[0]; 
            if (!points 
                || points.length === 0) {
                return 0;
            }

            let sumLng = 0, sumLat = 0;
            points.forEach(coord => {
                sumLng += coord[0];
                sumLat += coord[1];
            });

            const centerLng = sumLng / points.length;
            const centerLat = sumLat / points.length;
            const scales = getGlobalMetricScales(centerLat);
            
            let projectedPoints = points.map(coord => [
                (coord[0] - centerLng) * scales.lngToMeters,
                (coord[1] - centerLat) * scales.latToMeters
            ]);
            
            let numPoints = projectedPoints.length;
            let area = 0;

            for (let i = 0; i < numPoints; i++) {
                let j = (i + 1) % numPoints;
                area += projectedPoints[i][0] * projectedPoints[j][1];
                area -= projectedPoints[j][0] * projectedPoints[i][1];
            }

            return Math.abs(area / 2);

        }


        function calculateTiles() {
            
            if (!currentBounds) return;
            // Earth radius constants
            const EARTH_R_KM = 6378.137; 
            const EARTH_R_M = 6371009;     

            // map xoom level
            const zoom = map.getZoom();
            document.getElementById('current-zoom').innerHTML = `<strong>Current Zoom Level:</strong> ${zoom}`;

            // 1. Get structural limits for the raw loop index search grid
            const minLng = currentBounds.getWest(), maxLng = currentBounds.getEast();
            const minLat = currentBounds.getSouth(), maxLat = currentBounds.getNorth();

            const xMin = lon2tile(minLng, zoom), xMax = lon2tile(maxLng, zoom);
            const yMin = lat2tile(maxLat, zoom), yMax = lat2tile(minLat, zoom);
            let turfPolygon;

            try {

                // Extract current active shape directly from text-area
                const rawInput = document.getElementById('polygon-input').value.trim();
                const polygonObj = JSON.parse(rawInput);

                const coordsArray = polygonObj["coordinates"];
                let rawTurfPolygon = turf.polygon(coordsArray);
                // Enforce right-hand rule winding 
                // for accurate area calculation
                turfPolygon = turf.rewind(rawTurfPolygon, { mutate: true });


            } catch(e) {
                // Halt calculation if text payload is invalid or being typed
                return; 
            }

            // calculate area by correcting for ellipsoidal 
            // shape of the earth. we use Azimuthal equidistant approximation 
            // using the center of our polygon instead of using UTM zones.  
            const totalPolygonArea_M2_A = calculatePlanarConvexArea(turfPolygon.geometry.coordinates);
            // altitude correction 
            const altitudeElement = document.getElementById('altitude-input');
            const h = altitudeElement ? parseFloat(altitudeElement.value) || 0 : 0; 
            const altitudeScaleFactor = Math.pow(1 + h / EARTH_R_M, 2); 
            // Adjust the planar area dynamically
            const totalPolygonAreaM2 = totalPolygonArea_M2_A * altitudeScaleFactor;

            
            const midLat = (minLat + maxLat) / 2;
            const tileSideKm = (Math.cos(midLat * Math.PI / 180) * 2 * Math.PI * EARTH_R_KM) / Math.pow(2, zoom);
            const tileAreaKm2 = tileSideKm * tileSideKm;

            let intersectingTiles = [];
            const totalTiles = (xMax - xMin + 1) * (yMax - yMin + 1);

            // Helper functions to reverse tile index back to dynamic Lon/Lat edges
            function tile2lon(x, z) { return x / Math.pow(2, z) * 360 - 180; }
            function tile2lat(y, z) {
                const n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
                return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
            }

            // Scan bounding grid, 
            // and test exact polygon geometric intersections
            for (let x = xMin; x <= xMax; x++) {
                for (let y = yMin; y <= yMax; y++) {
                    // Calculate spatial boundaries of this specific individual tile
                    const w = tile2lon(x, zoom);
                    const e = tile2lon(x + 1, zoom);
                    const n = tile2lat(y, zoom);
                    const s = tile2lat(y + 1, zoom);

                    // Turn the single tile space into a turf layout box polygon
                    const turfTileBox = turf.bboxPolygon([w, s, e, n]);

                    // True spatial geometry overlap query evaluation
                    const intersection = turf.intersect(turf.featureCollection([turfPolygon, turfTileBox]));

                    if (intersection) {
                        // Calculate Tile intersection area & coverage percentage ---
                        const tileAreaM2 = turf.area(turfTileBox);
                        const intersectionAreaM2 = turf.area(intersection);
                        const coveragePercentage = (intersectionAreaM2 / tileAreaM2) * 100;

                        intersectingTiles.push({
                            x: x, 
                            y: y,
                            percentage: coveragePercentage.toFixed(1)
                        });
                    }
                }
            }

            const trueCount = intersectingTiles.length;
            const bounding_x_tiles = (xMax - xMin + 1);
            const bounding_y_tiles = (yMax - yMin + 1);
            const areaInfo = formatPolygonArea(totalPolygonAreaM2);

            //  Output string text generation
            let area_html = `<strong>Polygon Metrics:</strong><br>`;
            area_html += `Enclosed Area: <b>${areaInfo.value} ${areaInfo.unit}</b><br>`;
            area_html += `Bounding Box: ${totalTiles} tiles<br>`;
            area_html += `x: ${xMin}, ${xMax} (${bounding_x_tiles}) <br>`;
            area_html += `y: ${yMin}, ${yMax} (${bounding_y_tiles}) <br>`;
            area_html += `Actual Touched Tiles: <b>${trueCount} tiles</b><br> <br>`;
            
            area_html += `<strong>Single Tile Metrics:</strong><br>`;
            area_html += `Side: <b>${tileSideKm.toFixed(3)} km</b><br>`;
            area_html += `Approx. Area: <b>${tileAreaKm2.toFixed(4)} km²</b><br><br>`;
            document.getElementById('polygon-data').innerHTML = area_html;
            

            let path_html = `<strong>Touching Tile Paths (% Coverage):</strong><br><ul class="tile-list">`;
            if (trueCount > 200) {
                path_html += `<li>List preview hidden (too many active intersections: ${trueCount}). Zoom in closer.</li>`;
            } else {
                intersectingTiles.forEach(t => {
                    path_html += `<li>/${zoom}/${t.x}/${t.y}.png (<b>${t.percentage}%</b>)</li>`;
                });
            }

            path_html += `</ul>`; 
            document.getElementById('tile-path').innerHTML = path_html;

        }


        // Parse User Manual Text Area Array Inputs
        function loadCoordinates() {

            try {

                const rawInput = document.getElementById('polygon-input').value.trim();
                const polygonObj = JSON.parse(rawInput);
                const coordinates = polygonObj["coordinates"];

                if (!Array.isArray(coordinates) || coordinates.length === 0) {
                    throw new Error("Must be a valid nested array framework.");
                }

                drawnItems.clearLayers();
                const leafletCoords = coordinates.map(ring => 
                    ring.map(coord => [coord[1], coord[0]])
                );

                const polygonLayer = L.polygon(leafletCoords, {
                    color: "#007bff", weight: 3, fillOpacity: 0.2
                });

                drawnItems.addLayer(polygonLayer);
                currentBounds = polygonLayer.getBounds();
                map.fitBounds(currentBounds);
                calculateTiles();


            } catch (error) {
                alert("Parsing Error! Verify your array structure looks exactly like:\n[[[lng, lat], [lng, lat], ...]]");
            }
        }

        // Intercept Leaflet Canvas Drawing Events
        map.on(L.Draw.Event.CREATED, function (e) {

            drawnItems.clearLayers();
            const layer = e.layer;
            drawnItems.addLayer(layer);

            const latlngs = layer.getLatLngs()[0];
            const outputCoords = latlngs.map(ll => [
                parseFloat(ll.lng.toFixed(8)), 
                parseFloat(ll.lat.toFixed(8))
            ]);

            if (outputCoords.length > 0) {
                outputCoords.push([outputCoords[0][0], outputCoords[0][1]]);
            }

            const polygonObj = {
                "type": "Polygon",
                "coordinates": [outputCoords]
            }

            document.getElementById('polygon-input').value = JSON.stringify(polygonObj, null, 2);
            currentBounds = layer.getBounds();
            calculateTiles();

        });

        map.on(L.Draw.Event.EDITED, function (e) {

            e.layers.eachLayer(function (layer) {
                const latlngs = layer.getLatLngs()[0];
                const outputCoords = latlngs.map(ll => [
                    parseFloat(ll.lng.toFixed(8)), 
                    parseFloat(ll.lat.toFixed(8))
                ]);
                if (outputCoords.length > 0) {
                    outputCoords.push([outputCoords[0][0], outputCoords[0][1]]);
                }

                const polygonObj = {
                    "type": "Polygon",
                    "coordinates": [outputCoords]
                }

                document.getElementById('polygon-input').value = JSON.stringify(polygonObj, null, 2);
                currentBounds = layer.getBounds();
                calculateTiles();
            });
        });

        map.on(L.Draw.Event.DELETED, function () {
            currentBounds = null;
            document.getElementById('polygon-input').value = "";
            document.getElementById('polygon-data').innerHTML = "Paste a valid coordinate array or use the map draw tool to compute tiles.";
        });

        map.on('zoomend', calculateTiles);

        // Initial setup load
        loadCoordinates();
    </script>
</body>
</html>
