<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Notes Studio</title>
    
    <!-- Unified CSS Architecture Target Link -->
    <link rel="stylesheet" href="studio-engine.css" id="studio-css-target">
</head>
<body>

    <!-- Development Action Controller Strip -->
    <div id="dev-controls">
        <button class="dev-btn" id="reload-btn">🔄 Reload Studio</button>
        <button class="dev-btn secondary" id="export-btn">💾 Export Production HTML</button>
        <span class="dev-badge">ES6 Modular Engine</span>
    </div>

    <!-- Active Workspace Split Panel Grid -->
    <div id="workspace">
        <div class="pane" style="border-right: 1px solid #2d3139;">
            <textarea id="editor" placeholder="Start typing your technical notes here in markdown..."></textarea>
        </div>
        <div class="pane">
            <div id="preview">
                <div id="preview-content"></div>
            </div>
        </div>
    </div>

    <!-- Isolated JS Engine Component Module -->
    <script type="module" src="studio-engine.js"></script>

</body>
</html>
