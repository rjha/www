<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNF10 Studio</title>
    
    <link rel="stylesheet" href="/studio/editor.css" id="studio-css-target">
    

</head>
<body>

    <!-- Top Action Toolbar Strip -->
    <div id="dev-controls">
        <button class="dev-btn" id="save-btn">Save Edits</button>
        <button class="dev-btn secondary" id="reload-btn">Reload Studio</button>
        <!-- <button class="dev-btn secondary" id="export-note-btn">Export Source</button> --> 
        <button class="dev-btn secondary" id="export-html-btn">🚀 Export HTML</button>

        <!-- Editor Toolbar Dropdown Container -->
        <div class="menu-item-wrapper" id="editor-menu-wrapper">
            <button class="menu-trigger" id="menu-main-trigger">⚙️ Editor</button>
            <div class="menu-dropdown">
                <!-- Direct action to slide the formatting snippet bar open/closed -->
                <button id="menu-toggle-toolbar">Markdown Toolbar</button>
                <div class="menu-divider"></div>
                
                <!-- 2-Level Nested Cascading Menu Item -->
                <div class="submenu-wrapper">
                    <button class="submenu-trigger">🌈 Change Theme  ➔</button>
                    <div class="submenu-dropdown">
                        <button data-theme="theme-light">Warm Off-White</button>
                        <button data-theme="theme-slate">Slate Gray</button>
                        <button data-theme="theme-dark">Linux Terminal</button>
                    </div>
                </div>
                <div class="menu-divider"></div>
                    <button id="export-note-btn"">Export Source</button>
            </div>
        </div>

        <span class="dev-badge" id="status-badge">Status []</span>
    </div>

    <!-- Collapsible GitHub Style Markdown Toolbar Container (Hidden by default) -->
    <div id="markdown-toolbar" class="collapsed">
        <button data-action="h1">H1</button>
        <button data-action="h2">H2</button>
        <button data-action="bold"><b>B</b></button>
        <button data-action="italic"><i>I</i></button>
        <button data-action="list">• List</button>
        <div class="tb-divider"></div>
       
        <button data-action="link">🔗 Link</button>
        <button data-action="code">☕ Code Block</button>
        <button data-action="photo">📷 Photo</button>
        <button data-action="video">📺 Video</button>
        
        <div class="tb-divider"></div>
        <!-- NEW: Dedicated Close Button Float Anchor -->
        <button id="close-toolbar-btn" title="Close Toolbar">➜] Close</button>
    </div>

    <!-- Active Workspace Split Panel Grid -->
    <div id="workspace">
        <!-- Editor Pane Section Container -->
        <!-- Editor Pane Section Container -->
        <div class="pane" id="editor-pane">

            <div class="pane-header" id="editor-header">SOURCE EDITOR</div>
            <textarea id="editor" placeholder="Start typing your technical notes here in markdown... (Press Cmd+S or Ctrl+S to parse)"></textarea>
        </div>
        
        <!-- Thicker, Adjustable Panel Splitter Element -->
        <div id="splitter"></div>
        
        <!-- Preview Pane Section Container -->
        <div class="pane" id="preview-pane">
            <!-- New Semantic Native Header Tab Handle -->
            <div class="pane-header" id="preview-header">PREVIEW WINDOW</div>
            <div id="preview">
                <div id="preview-content"></div>
            </div>
        </div>
    </div>

    <!-- Isolated JS Engine Component Module -->
    <script type="module" src="/studio/editor.js"></script>

</body>
</html>
