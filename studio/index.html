<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Notes Studio</title>
    
    <!-- Unified CSS Architecture Target Link -->
    <link rel="stylesheet" href="/studio/studio-engine.css" id="studio-css-target">
</head>
<body>

    <!-- Development Action Controller Strip -->
    <div id="dev-controls">
        <button class="dev-btn" id="save-btn">Save Edits</button>
        <button class="dev-btn secondary" id="reload-btn">Reload Studio</button>
        <button class="dev-btn secondary" id="export-note-btn">Export Source</button>
        <button class="dev-btn secondary" id="export-html-btn">Export HTML</button>

        <!-- Interactive Theme Changer Dropdown Menu -->
        <select class="theme-selector" id="theme-dropdown">
            <option value="theme-light">🎨 Off-White</option>
            <option value="theme-slate">🎨 Slate Gray</option>
            <option value="theme-dark">🎨 Terminal Black</option>
        </select>


        <span class="dev-badge" id="status-badge">ES6 Explicit Save Active</span>

    </div>


    <!-- Active Workspace Split Panel Grid -->
    <div id="workspace">
        <div class="pane" id="editor-pane">
            <textarea id="editor" placeholder="Start typing your technical notes here in markdown... (Press Cmd+S or Ctrl+S to parse)"></textarea>
        </div>
        
        <!-- Thicker, Adjustable Panel Splitter Element -->
        <div id="splitter"></div>
        
        <div class="pane" id="preview-pane">
            <div id="preview">
                <div id="preview-content"></div>
            </div>
        </div>
    </div>

    <!-- Isolated JS Engine Component Module -->
    <script type="module" src="/studio/studio-engine.js"></script>

</body>
</html>
